*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#eef2f3;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-tap-highlight-color:transparent}body{touch-action:manipulation}#root{position:fixed;inset:0;background:#050607}#screen{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity .18s linear}#screen.live{opacity:1}#veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 56% at 50% 100%,rgba(7,12,14,.16),rgba(5,6,7,.82) 85%);mix-blend-mode:normal}#metal{position:absolute;inset:0;pointer-events:none}#glyph{position:absolute;left:50%;top:calc(9px + env(safe-area-inset-top));width:42px;height:12px;transform:translateX(-50%);opacity:.78}#glyph:before,#glyph:after{content:"";position:absolute;top:5px;height:1px;background:currentColor;transition:all .16s ease}#glyph:before{left:0;width:14px}#glyph:after{right:0;width:14px}.online #glyph:before,.online #glyph:after{width:18px}.online #glyph{color:#dce5e8}.working #glyph:before{transform:rotate(12deg);transform-origin:right}.working #glyph:after{transform:rotate(-12deg);transform-origin:left}#readout{position:absolute;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));display:grid;gap:5px;pointer-events:none}#surface{font-size:12px;line-height:1.35;white-space:pre-wrap;max-height:28vh;overflow:hidden;text-shadow:0 1px 8px #000;background:linear-gradient(90deg,rgba(3,5,6,.72),rgba(3,5,6,.18));padding:8px 10px;border-left:1px solid rgba(225,237,240,.26);opacity:0;transform:translateY(4px);transition:opacity .12s linear,transform .12s linear}#surface.has{opacity:1;transform:none}#trace{font-size:9px;letter-spacing:.08em;color:rgba(216,227,230,.52);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:11px}#dock{position:absolute;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:62px;display:grid;grid-template-columns :.28}}#boottrace{position:absolute;left:20px;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));text-align:center;font-size:9px;letter-spacing:.12em;color:rgba(220,230,233,.38);white-space:pre-wrap}#fallback{position:absolute;inset:0;display:none;place-items:center;z-index:9;background:#050607}#fallback button{width:58px;height:58px;border-radius:50%;border:1px solid rgba(230,240,242,.22);background:#0b0e10;color:#e6edef;font-size:0}#fallback button:after{content:"↻";font-size:22px}canvas#nodes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
</style><style id="liveStyle"></style></head><body><div id="root"><img id="screen"><canvas id="nodes"></canvas><div id="veil"></div><div id="metal"><div id="glyph"></div><div id="readout"><div id="surface"></div><div id="trace"></div></div><div id="dock"><button id="mic" aria-label="microphone"></button><div id="field"><div id="draft" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder=""></div><i id="pulse"></i></div></div></div><div id="gate"><button id="seed" aria-label="enter"></button><div id="boottrace"></div></div><div id="fallback"><button id="retry" aria-label="retry"></button></div></div><script>
(()=>{'use strict';
const TAIL='https://desktop-6fn9b4m-1.tail1bf489.ts.net:8444';
const BRIDGE_RAW='https://raw.githubusercontent.com/Pokitomas/archie-backend-xfer-1787735782/master/phone_bridge.py';
const $=id=>document.getElementById(id),root=$('root'),screen=$('screen'),gate=$('gate'),boottrace=$('boottrace'),draft=$('draft'),mic=$('mic'),surface=$('surface'),trace=$('trace'),liveStyle=$('liveStyle'),nodes=$('nodes'),ctx=nodes.getContext('2d');

const sleep=ms=>new Promise(r=>setTimeout(r,ms));const rand=n=>{const a=crypto.getRandomValues(new Uint8Array(n));let s='';for(const b of a)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
function status(s){boottrace.textContent=s||''}function setState(s){root.classList.remove('online','working','typing');for(const x of s.split(/\s+/))if(x)root.classList.add(x)}
function params(){const h=(location.hash||'').slice(1),p=new URLSearchParams(h);return p}function save(){if(bridge&&token)localStorage.setItem('archie.phone.v2',JSON.stringify({bridge,token,at:Date.now()}))}function restore(){try{const v=JSON.parse(localStorage.getItem('archie.phone.v2')||'{}');if(v.bridge&&v.token&&Date.now()-(v.at||0)<86400000){bridge=v.bridge;token=v.token;return true}}catch(_){}return false}
async function timeoutFetch(url,opt={},ms=2500){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);try{return await fetch(url,{cache:'no-store',...opt,signal:ac.signal})}finally{clearTimeout(tm)}}
async function tailGet(path,ms=2400){const r=await timeoutFetch(TAIL+path,{},ms);if(!r.ok)throw Error('tail '+r.status);return await r.json()}async function tailPost(path,obj,ms=3500){const r=await timeoutFetch(TAIL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)},ms);let v={};try{v=await r.json()}catch(_){}if(!r.ok)throw Error('tail '+r.status);return v}async function action(o){o.agent=agent;return tailPost('/action',o,5000)}
async function rendezvous(){for(let i=0;i<90;i++){try{const r=await timeoutFetch('https://ntfy.sh/'+encodeURIComponent(topic)+'/json?poll=1&since=all',{},2200);if(r.ok){const txt=await r.text();for(const line of txt.trim().split('\n').reverse()){try{const v=JSON.parse(line),m=JSON.parse(v.message||'{}');if(m.url&&m.token===token)return m.url.replace(/\/$/,'')}catch(_){}}}}catch(_){}try{const w=await tailGet('/windows',1600),m=JSON.stringify(w).match(/https:\/\/[a-z0-9-]+\.trycloudflare\.com/i);if(m)return m[0]}catch(_){}await sleep(450)}return ''}

status('·');await action({action:'clipboard_set',text:cmd,value:cmd,clipboard:cmd});await action({action:'hotkey',keys:['win','r']});await sleep(350);await action({action:'hotkey',keys:['ctrl','v']});await sleep(120);let k=await action({action:'key',key:'enter'}).catch(()=>null);if(k&&k.ok===false)await action({action:'hotkey',keys:['enter']});status('··');const u=await rendezvous();if(!u)throw Error('bridge');bridge=u;save();await connect()}
async function api(path,opt={},ms=3500){if(!bridge)throw Error('no bridge');const h={...(opt.headers||{}),'Authorization':'Bearer '+token};return timeoutFetch(bridge+path,{...opt,headers:h},ms)}

function applySkin(v){if(!v||typeof v!=='object')return;if(typeof v.css==='string')liveStyle.textContent=v.css.slice(0,50000);if(typeof v.placeholder==='string')draft.dataset.placeholder=v.placeholder;if(Array.isArray(v.nodes))nodeFrame=v.nodes.slice(0,128)}
function drawNodes(){const dpr=Math.max(1,Math.min(3,devicePixelRatio||1)),w=nodes.clientWidth,h=nodes.clientHeight;if(nodes.width!==Math.round(w*dpr)||nodes.height!==Math.round(h*dpr)){nodes.width=Math.round(w*dpr);nodes.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);for(const n of nodeFrame){if(!n||typeof n!=='object')continue;ctx.globalAlpha=Math.max(0,Math.min(1,Number(n.alpha??1)));ctx.strokeStyle=String(n.stroke||'rgba(235,242,244,.5)');ctx.fillStyle=String(n.fill||'rgba(235,242,244,.14)');ctx.lineWidth=Math.max(.5,Number(n.line||1));if(n.kind==='line'){ctx.beginPath();ctx.moveTo(Number(n.x1||0)*w,Number(n.y1||0)*h);ctx.lineTo(Number(n.x2||0)*w,Number(n.y2||0)*h);ctx.stroke()}else if(n.kind==='ring'){ctx.beginPath();ctx.arc(Number(n.x||.5)*w,Number(n.y||.5)*h,Number(n.r||.03)*Math.min(w,h),0,Math.PI*2);n.fill&&ctx.fill();ctx.stroke()}else if(n.kind==='text'){ctx.font=String(n.font||'11px ui-monospace');ctx.textAlign=String(n.align||'left');ctx.fillStyle=String(n.fill||'#eaf0f1');ctx.fillText(String(n.text||''),Number(n.x||0)*w,Number(n.y||0)*h)}}ctx.globalAlpha=1;requestAnimationFrame(drawNodes)}requestAnimationFrame(drawNodes)
async function startStateLoop(){let n=0;while(session){try{const r=await api('/api/state?n='+(n++),{},2600);if(!r.ok)throw Error();const s=await r.json(),seat=s.seat||{},reply=seat.reply||{},txt=String(reply.text||'');setState('online '+((reply.done===false||s.bus?.active)?'working':''));if(txt!==lastReply){lastReply=txt;surface.textContent=txt;surface.classList.toggle('has',!!txt)}const ev=s.event||s.bus?.event||'';trace.textContent=typeof ev==='string'?ev:JSON.stringify(ev||'');applySkin(s.skin)}catch(e){setState('');await sleep(300)}await sleep(70)}}
async function startPulseLoop(){while(session){try{const r=await api('/api/live-input');if(r.ok){const v=await r.json();root.classList.toggle('typing',!!v.text_active)}}catch(_){}await sleep(90)}}
function resample(input,from,to=16000){if(from===to)return input;const ratio=from/to,n=Math.max(1,Math.floor(input.length/ratio)),out=new Float32Array(n);for(let i=0;i<n;i++){const a=Math.floor(i*ratio),b=Math.min(input.length-1,Math.floor((i+1)*ratio));let sum=0,c=0;for(let j=a;j<=b;j++){sum+=input[j];c++}out[i]=c?sum/c:0}return out}function pcm16(f){const a=new Int16Array(f.length);for(let i=0;i<f.length;i++){const x=Math.max(-1,Math.min(1,f[i]));a[i]=x<0?x*32768:x*32767}return a.buffer}
async function startMic(){if(micOn||!session)return;try{micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});audioCtx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});source=audioCtx.createMediaStreamSource(micStream);processor=audioCtx.createScriptProcessor(1024,1,1);processor.onaudioprocess=e=>{if(!micOn)return;const f=resample(e.inputBuffer.getChannelData(0),audioCtx.sampleRate,16000);fetch(bridge+'/api/audio?rate=16000',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/octet-stream'},body:pcm16(f),cache:'no-store'}).catch(()=>{})};source.connect(processor);processor.connect(audioCtx.destination);micOn=true;mic.classList.add('live')}catch(e){trace.textContent=String(e)}}function stopMic(){micOn=false;mic.classList.remove('live');if(processor)try{processor.disconnect()}catch(_){}if(source)try{source.disconnect()}catch(_){}if(micStream)micStream.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close().catch(()=>{});processor=source=micStream=audioCtx=null}mic.onclick=()=>micOn?stopMic():startMic();
function sendDraft(final=false){if(!session)return;const text=(draft.innerText||'').replace(/\u00a0/g,' '),same=text===lastDraft&&!final;if(same)return;lastDraft=text;revision++;clearTimeout(inputTimer);root.classList.add('typing');api('/api/text-stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stream_id:inputStream,revision,text,final})},1800).catch(()=>{});if(final){draft.innerHTML='';lastDraft='';inputStream=crypto.randomUUID();revision=0;root.classList.remove('typing')}}draft.addEventListener('input',()=>{sendDraft(false);clearTimeout(inputTimer);inputTimer=setTimeout(()=>sendDraft(false),34)});draft.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendDraft(true)}});draft.addEventListener('compositionend',()=>sendDraft(false));
