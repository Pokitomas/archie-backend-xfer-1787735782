<style id="base">
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;-webkit-tap-highlight-color:transparent}body{touch-action:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}#root{position:fixed;inset:0;overflow:hidden;background:#000}#screen{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0}#screen.live{opacity:1}#scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#layers{position:absolute;inset:0;pointer-events:none}.scene-layer{position:absolute;white-space:pre-wrap;overflow:hidden;pointer-events:none}#ink{position:absolute;z-index:5;left:0;right:0;bottom:0;height:34vh;min-height:120px;padding:0;margin:0;border:0;outline:0;background:transparent;resize:none;color:transparent;caret-color:transparent;font:16px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-text-fill-color:transparent}#ear{position:absolute;z-index:6;left:0;bottom:0;width:28vw;height:34vh;min-width:88px;min-height:120px;background:transparent;border:0;outline:0}#liveStyle{display:none}

<body>
<div id="root"><img id="screen" alt=""><canvas id="scene"></canvas><div id="layers"></div><textarea id="ink" aria-label="live text input" autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true"></textarea><div id="ear" role="button" aria-label="voice field" tabindex="0"></div><i id="liveStyle"></i></div>
<script>
(()=>{'use strict';
const TAIL='https://desktop-6fn9b4m-1.tail1bf489.ts.net:8444';
const BRIDGE_RAW='https://raw.githubusercontent.com/Pokitomas/archie-backend-xfer-1787735782/master/phone_bridge.py';
const $=id=>document.getElementById(id),root=$('root'),screen=$('screen'),canvas=$('scene'),ctx=canvas.getContext('2d'),layers=$('layers'),ink=$('ink'),ear=$('ear'),sceneStyle=$('sceneStyle');
let bridge='',token='',topic='',agent='gpt56sol-interface-live',session=false,awake=false,sceneDef={revision:0,css:'',layers:[],nodes:[],features:{}},sceneRevision=-1;
let model={status:'cold',latency:'',reply:{text:''},draft:{text:''},voice:{active:false},bus:{event:''},seat:{},selftest:{}};
let micOn=false,micStream=null,audioCtx=null,processor=null,source=null,audioQueue=[],audioQueuedBytes=0,audioSending=false,MAX_AUDIO_BYTES=192000;
let streamId=crypto.randomUUID(),revision=0,lastSentDraft='',draftTimer=0,bootPromise=null,recovering=false,recoverBackoff=220,screenEpoch=0,pointerStart=null,lastTapAt=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),rand=n=>{const a=crypto.getRandomValues(new Uint8Array(n));let s='';for(const b of a)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},now=()=>performance.now();
function getPath(o,p){let v=o;for(const k of String(p||'').split('.')){if(!k)continue;if(v==null)return '';v=v[k]}return v==null?'':v}
function remember(){if(bridge&&token)localStorage.setItem('archie.phone.v4',JSON.stringify({bridge,token,at:Date.now()}))}function recall(){try{const v=JSON.parse(localStorage.getItem('archie.phone.v4')||'{}');if(v.bridge&&v.token&&Date.now()-(v.at||0)<604800000){bridge=v.bridge;token=v.token;return true}}catch(_){}return false}
function forgetBridge(){bridge='';token='';session=false;screen.classList.remove('live');screen.removeAttribute('src')}
function timeoutFetch(url,opt={},ms=2500){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);return fetch(url,{cache:'no-store',...opt,signal:ac.signal}).finally(()=>clearTimeout(tm))}
function localSelfTest(){const c={crypto:!!globalThis.crypto?.getRandomValues,fetch:typeof fetch==='function',canvas:!!ctx,storage:true,audio:!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),events:typeof PointerEvent!=='undefined'};try{localStorage.setItem('archie.phone.probe','1');localStorage.removeItem('archie.phone.probe')}catch(_){c.storage=false}return {ok:Object.values(c).every(Boolean),checks:c}}
async function tailGet(path,ms=1800){const r=await timeoutFetch(TAIL+path,{},ms);if(!r.ok)throw Error('tail '+r.status);return r.json()}async function tailPost(path,obj,ms=3500){const r=await timeoutFetch(TAIL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)},ms);let v={};try{v=await r.json()}catch(_){}if(!r.ok)throw Error('tail '+r.status);return v}async function action(obj){obj.agent=agent;return tailPost('/action',obj,5000)}
async function api(path,opt={},ms=2600){if(!bridge||!token)throw Error('bridge absent');const t=now(),r=await timeoutFetch(bridge+path,{...opt,headers:{...(opt.headers||{}),'Authorization':'Bearer '+token}},ms);model.latency=Math.max(0,Math.round(now()-t))+'ms';return r}
function ensureCanvas(){const dpr=Math.max(1,Math.min(3,devicePixelRatio||1)),w=innerWidth,h=innerHeight,nw=Math.round(w*dpr),nh=Math.round(h*dpr);if(canvas.width!==nw||canvas.height!==nh){canvas.width=nw;canvas.height=nh;canvas.style.width=w+'px';canvas.style.height=h+'px'}ctx.setTransform(dpr,0,0,dpr,0,0)}
function num(v,d=0){if(typeof v==='number')return v;if(typeof v==='string'){const n=Number(getPath(model,v));return Number.isFinite(n)?n:d}return d}
function drawScene(){ensureCanvas();const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);for(const n of Array.isArray(sceneDef.nodes)?sceneDef.nodes:[]){if(!n||typeof n!=='object'||(n.when&&!getPath(model,n.when)))continue;ctx.globalAlpha=Math.max(0,Math.min(1,num(n.alpha,1)));ctx.strokeStyle=String(n.stroke||'rgba(255,255,255,.5)');ctx.fillStyle=String(n.fill||'transparent');ctx.lineWidth=Math.max(.25,num(n.line,1));const x=num(n.x,.5)*w,y=num(n.y,.5)*h,r=num(n.r,.03)*Math.min(w,h);if(n.kind==='ring'||n.kind==='disc'){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(n.kind==='disc'||n.fill)ctx.fill();if(n.stroke)ctx.stroke()}else if(n.kind==='arc'){ctx.beginPath();ctx.arc(x,y,r,num(n.a0,0),num(n.a1,Math.PI*2));ctx.stroke()}else if(n.kind==='line'){ctx.beginPath();ctx.moveTo(num(n.x1,0)*w,num(n.y1,0)*h);ctx.lineTo(num(n.x2,1)*w,num(n.y2,1)*h);ctx.stroke()}else if(n.kind==='polyline'&&Array.isArray(n.points)){ctx.beginPath();n.points.forEach((p,i)=>{const px=num(p[0],0)*w,py=num(p[1],0)*h;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke()}else if(n.kind==='wave'){const amp=num(n.amp,.02)*h,freq=num(n.freq,4),phase=performance.now()/1000*num(n.speed,1);ctx.beginPath();for(let i=0;i<=80;i++){const q=i/80,px=q*w,py=y+Math.sin(q*Math.PI*2*freq+phase)*amp*(.35+.65*Math.sin(q*Math.PI));i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke()}}ctx.globalAlpha=1;requestAnimationFrame(drawScene)}requestAnimationFrame(drawScene);
function buildLayers(){layers.replaceChildren();for(const d of Array.isArray(sceneDef.layers)?sceneDef.layers:[]){if(!d||typeof d!=='object'||!d.id)continue;const el=document.createElement(d.tag==='span'?'span':'div');el.className='scene-layer '+String(d.class||'');el.dataset.sceneId=String(d.id);if(d.style&&typeof d.style==='object')Object.assign(el.style,d.style);layers.appendChild(el)}}
function renderLayers(){for(const d of Array.isArray(sceneDef.layers)?sceneDef.layers:[]){const el=layers.querySelector('[data-scene-id="'+CSS.escape(String(d.id))+'"]');if(!el)continue;let v=getPath(model,d.bind||'');if(typeof d.prefix==='string'&&v!=='')v=d.prefix+v;if(typeof d.suffix==='string'&&v!=='')v=v+d.suffix;const text=String(v??'');el.textContent=text;el.hidden=!!d.hideEmpty&&!text}}
function applyScene(v){if(!v||typeof v!=='object')return;const rev=Number(v.revision||0);if(rev===sceneRevision&&JSON.stringify(v)===JSON.stringify(sceneDef))return;sceneDef=v;sceneRevision=rev;sceneStyle.textContent=String(v.css||'').slice(0,100000);buildLayers();renderLayers()}
async function remoteSelfTest(){const a=await api('/api/selftest',{},1800);if(!a.ok)throw Error('remote selftest');const s=await a.json();if(!s.ok)throw Error('remote selftest');const h=await api('/api/health',{},1800);if(!h.ok)throw Error('remote health');const hv=await h.json();if(!hv.ok)throw Error('remote health');model.selftest=s;return true}
async function openSession(){await remoteSelfTest();const r=await api('/api/session',{method:'POST'},2200);if(!r.ok)throw Error('session '+r.status);session=true;remember();recoverBackoff=220;model.status='live';startScreen();flushIngress();return true}
function startScreen(){if(!bridge||!token)return;screenEpoch++;screen.src=bridge+'/api/screen.mjpg?t='+encodeURIComponent(token)+'&e='+screenEpoch;screen.classList.add('live')}screen.onerror=()=>{screen.classList.remove('live');if(session)setTimeout(startScreen,180)};
async function rendezvous(){for(let i=0;i<110;i++){try{const r=await timeoutFetch('https://ntfy.sh/'+encodeURIComponent(topic)+'/json?poll=1&since=all',{},1600);if(r.ok){const txt=await r.text();for(const line of txt.trim().split('\n').reverse()){try{const v=JSON.parse(line),m=JSON.parse(v.message||'{}');if(m.url&&m.token===token)return String(m.url).replace(/\/$/,'')}catch(_){}}}}catch(_){}try{const w=await tailGet('/windows',1200),m=JSON.stringify(w).match(/https:\/\/[a-z0-9-]+\.trycloudflare\.com/i);if(m)return m[0]}catch(_){}await sleep(280)}throw Error('rendezvous')}
async function bootstrap(){if(bootPromise)return bootPromise;bootPromise=(async()=>{const local=localSelfTest();if(!local.ok)throw Error('local selftest');const h=await tailGet('/seat/head',1800);if(!h||h.error||!h.active_occupant)throw Error('controller selftest');agent=h.active_occupant||agent;token=rand(32);topic='archie-'+rand(18).toLowerCase();try{await action({action:'timebox',seconds:900,label:'default-chat 15m phone field; temporal pressure only'})}catch(_){}const cmd=`powershell -NoProfile -ExecutionPolicy Bypass -Command "$u='${BRIDGE_RAW}';$p=Join-Path $env:TEMP 'archie_phone_bridge.py';Invoke-WebRequest -UseBasicParsing $u -OutFile $p;Get-CimInstance Win32_Process | ? {$_.Name -match '^python' -and $_.CommandLine -like '*archie_phone_bridge.py*'} | % {Stop-Process -Id $_.ProcessId -Force};py -3.12 $p --token '${token}' --topic '${topic}'"`;await action({action:'clipboard_set',text:cmd,value:cmd,clipboard:cmd});await action({action:'hotkey',keys:['win','r']});await sleep(220);await action({action:'hotkey',keys:['ctrl','v']});await sleep(80);await action({action:'key',key:'enter'});bridge=await rendezvous();await openSession()})().finally(()=>{bootPromise=null});return bootPromise}
async function recoverForever(){if(recovering)return;recovering=true;while(true){if(session){await sleep(300);continue}model.status='recovering';renderLayers();try{if(bridge&&token){try{await openSession();continue}catch(_){forgetBridge()}}if(!bridge)recall();if(bridge&&token){try{await openSession();continue}catch(_){forgetBridge()}}if(awake&&navigator.onLine){await bootstrap();continue}}catch(_){}await sleep(recoverBackoff);recoverBackoff=Math.min(6000,Math.round(recoverBackoff*1.55))}}recoverForever();
async function stateLoop(){while(true){if(!session){await sleep(90);continue}try{const r=await api('/api/state?x='+Date.now(),{},1800);if(!r.ok)throw Error('state');const s=await r.json(),seat=s.seat||{},bus=s.bus||{};Object.assign(model,{status:'live',reply:seat.reply||{},bus,seat,selftest:s.selftest||model.selftest});if(s.scene)applyScene(s.scene);renderLayers()}catch(_){session=false;model.status='recovering'}await sleep(70)}}stateLoop();
function resample(input,from,to=16000){if(from===to)return input;const ratio=from/to,n=Math.max(1,Math.floor(input.length/ratio)),out=new Float32Array(n);for(let i=0;i<n;i++){const a=Math.floor(i*ratio),b=Math.min(input.length-1,Math.floor((i+1)*ratio));let sum=0,c=0;for(let j=a;j<=b;j++){sum+=input[j];c++}out[i]=c?sum/c:0}return out}function pcm16(f){const a=new Int16Array(f.length);for(let i=0;i<f.length;i++){const x=Math.max(-1,Math.min(1,f[i]));a[i]=x<0?x*32768:x*32767}return a.buffer}
function queueAudio(buf){audioQueue.push(buf);audioQueuedBytes+=buf.byteLength;while(audioQueuedBytes>MAX_AUDIO_BYTES&&audioQueue.length){const q=audioQueue.shift();audioQueuedBytes-=q.byteLength}flushAudio()}
async function flushAudio(){if(audioSending||!session||!bridge)return;audioSending=true;try{while(session&&audioQueue.length){const b=audioQueue[0],r=await api('/api/audio?rate=16000',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:b},1600);if(!r.ok)throw Error('audio');audioQueue.shift();audioQueuedBytes-=b.byteLength}}catch(_){session=false}finally{audioSending=false}}
async function startMic(){if(micOn)return;try{micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});audioCtx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});source=audioCtx.createMediaStreamSource(micStream);processor=audioCtx.createScriptProcessor(1024,1,1);processor.onaudioprocess=e=>{if(micOn)queueAudio(pcm16(resample(e.inputBuffer.getChannelData(0),audioCtx.sampleRate,16000)))};source.connect(processor);processor.connect(audioCtx.destination);micOn=true;model.voice={active:true};renderLayers()}catch(_){model.voice={active:false};renderLayers()}}
function stopMic(){micOn=false;model.voice={active:false};renderLayers();if(processor)try{processor.disconnect()}catch(_){}if(source)try{source.disconnect()}catch(_){}if(micStream)micStream.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close().catch(()=>{});processor=source=micStream=audioCtx=null}ear.addEventListener('pointerdown',e=>{e.stopPropagation();micOn?stopMic():startMic()});ear.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();micOn?stopMic():startMic()}});
function sendDraft(final=false){const text=ink.value.replace(/\u00a0/g,' ');model.draft={text};renderLayers();if(!text&&!final)return;revision++;const payload={stream_id:streamId,revision,text,final};if(session)api('/api/text-stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)},1200).catch(()=>{session=false});if(final){ink.value='';model.draft={text:''};streamId=crypto.randomUUID();revision=0;lastSentDraft='';renderLayers()}}
ink.addEventListener('input',()=>{const t=ink.value;if(t===lastSentDraft)return;lastSentDraft=t;sendDraft(false);clearTimeout(draftTimer);draftTimer=setTimeout(()=>sendDraft(false),28)});ink.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendDraft(true)}});function flushIngress(){flushAudio();if(ink.value)sendDraft(false)}
function screenPoint(e){const r=screen.getBoundingClientRect();return {nx:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),ny:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}
async function pointerAction(kind,p){if(!session)return;try{if(kind==='tap')await api('/api/pointer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nx:p.nx,ny:p.ny,button:'left'})},1800);if(kind==='right')await api('/api/pointer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nx:p.nx,ny:p.ny,button:'right'})},1800);if(kind==='scroll')await api('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'scroll',dy:p.dy,dx:p.dx||0,intent:'phone surface scroll'})},1800)}catch(_){session=false}}
root.addEventListener('pointerdown',e=>{awake=true;if(!micOn)startMic();if(!session||e.target===ink||e.target===ear)return;pointerStart={id:e.pointerId,x:e.clientX,y:e.clientY,t:now(),p:screenPoint(e)};try{root.setPointerCapture(e.pointerId)}catch(_){}});root.addEventListener('pointerup',e=>{if(!pointerStart||e.pointerId!==pointerStart.id)return;const q=pointerStart;pointerStart=null;const dt=now()-q.t,dx=e.clientX-q.x,dy=e.clientY-q.y;if(Math.hypot(dx,dy)>18){pointerAction('scroll',{dy:Math.round(-dy*2.4),dx:Math.round(-dx*1.2)});return}if(dt>520){pointerAction('right',q.p);return}const t=now();if(t-lastTapAt<260){pointerAction('tap',q.p);setTimeout(()=>pointerAction('tap',q.p),45)}else pointerAction('tap',q.p);lastTapAt=t});
document.addEventListener('pointerdown',()=>{awake=true;if(!micOn)startMic()},{once:true,capture:true});window.addEventListener('online',()=>{session=false;recoverBackoff=180});window.addEventListener('visibilitychange',()=>{if(!document.hidden){session=false;recoverBackoff=180}});
})();
