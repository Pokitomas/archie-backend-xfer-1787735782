<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050607"><title>field</title>
<style id="base">
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#eef2f3;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-tap-highlight-color:transparent}body{touch-action:manipulation}#root{position:fixed;inset:0;background:#050607}#screen{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity .12s linear}#screen.live{opacity:1}#veil,#scene,#nodes{position:absolute;inset:0;pointer-events:none}#veil{background:rgba(5,6,7,.72)}#nodes{width:100%;height:100%}#scene>*{pointer-events:none}#metal{position:absolute;inset:0;pointer-events:none}#glyph{position:absolute;left:50%;top:calc(9px + env(safe-area-inset-top));width:42px;height:12px;transform:translateX(-50%);opacity:.55}#glyph:before,#glyph:after{content:"";position:absolute;top:5px;height:1px;width:12px;background:currentColor;transition:all .13s ease}#glyph:before{left:0}#glyph:after{right:0}.online #glyph:before,.online #glyph:after{width:18px}.working #glyph:before{transform:rotate(13deg);transform-origin:right}.working #glyph:after{transform:rotate(-13deg);transform-origin:left}.degraded #glyph{opacity:.24}#dock{position:absolute;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:60px;display:grid;grid-template-columns:50px minmax(0,1fr);gap:8px;align-items:stretch;pointer-events:auto}#mic{appearance:none;border:0;border-radius:18px;background:rgba(12,15,17,.72);box-shadow:inset 0 0 0 1px rgba(230,240,242,.14);position:relative;color:transparent}#mic:before,#mic:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:999px}#mic:before{width:10px;height:18px;border:1px solid rgba(234,241,243,.72)}#mic:after{width:21px;height:21px;border:1px solid transparent;border-bottom-color:rgba(234,241,243,.55)}#mic.live:before{width:11px;height:11px;background:rgba(226,245,234,.88);border-color:transparent}#field{position:relative;border-radius:18px;background:rgba(12,15,17,.72);box-shadow:inset 0 0 0 1px rgba(230,240,242,.12);overflow:hidden;display:flex;align-items:center}#draft{width:100%;height:100%;overflow-y:auto;outline:0;padding:19px 16px 15px;color:#f3f6f7;font-size:16px;line-height:1.2;white-space:pre-wrap;word-break:break-word}#draft:empty:before{content:attr(data-placeholder);color:rgba(230,238,240,.24)}#pulse{position:absolute;right:12px;bottom:10px;width:4px;height:4px;border-radius:50%;background:rgba(224,236,239,.18)}.typing #pulse{background:rgba(236,243,245,.85);box-shadow:0 0 10px rgba(236,243,245,.42)}#gate{position:absolute;inset:0;display:grid;place-items:center;background:#050607;z-index:8}#seed{width:72px;height:72px;border:0;background:transparent;position:relative;color:#dfe7e9}#seed:before,#seed:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid currentColor}#seed:before{width:44px;height:44px;opacity:.23}#seed:after{width:10px;height:10px;opacity:.8;animation:breath 1.05s ease-in-out infinite}@keyframes breath{50%{transform:translate(-50%,-50%) scale(.35);opacity:.2}}#boottrace{position:absolute;left:20px;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;font-size:9px;letter-spacing:.11em;color:rgba(220,230,233,.36);white-space:pre-wrap;line-height:1.5}.entered #gate{display:none}
</style><style id="liveStyle"></style></head>
<body><div id="root"><img id="screen"><canvas id="nodes"></canvas><div id="veil"></div><div id="scene"></div><div id="metal"><div id="glyph"></div><div id="dock"><button id="mic" aria-label="microphone"></button><div id="field"><div id="draft" contenteditable="true" role="textbox" aria-multiline="true"></div><i id="pulse"></i></div></div></div><div id="gate"><button id="seed" aria-label="enter"></button><div id="boottrace"></div></div></div>
<script>
(()=>{'use strict';
const TAIL='https://desktop-6fn9b4m-1.tail1bf489.ts.net:8444';
const BRIDGE_RAW='https://raw.githubusercontent.com/Pokitomas/archie-backend-xfer-1787735782/master/phone_bridge.py';
const $=id=>document.getElementById(id),root=$('root'),screen=$('screen'),sceneEl=$('scene'),draft=$('draft'),mic=$('mic'),liveStyle=$('liveStyle'),nodes=$('nodes'),ctx=nodes.getContext('2d'),boottrace=$('boottrace');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let bridge='',token='',topic='',agent='gpt56sol-interface-live',session=false,connecting=false,micOn=false,micStream=null,audioCtx=null,processor=null,source=null,inputStream=crypto.randomUUID(),revision=0,lastDraft='',pendingDraft=null,nodeFrame=[],sceneRevision=-1,features={},generation=0,lastState={},latency=0,statusText='touch to enter',screenBackoff=250,started=false;
const rand=n=>{const a=crypto.getRandomValues(new Uint8Array(n));let s='';for(const b of a)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
function setStatus(v){statusText=String(v||'');boottrace.textContent=statusText;renderBindings()}
function setState(...names){root.classList.remove('online','working','typing','degraded');for(const n of names.flatMap(x=>String(x||'').split(/\s+/)))if(n)root.classList.add(n)}
function params(){return new URLSearchParams((location.hash||'').slice(1))}
function save(){if(bridge&&token)localStorage.setItem('archie.phone.v3',JSON.stringify({bridge,token,topic,at:Date.now()}))}
function restore(){try{const v=JSON.parse(localStorage.getItem('archie.phone.v3')||'{}');if(v.bridge&&v.token&&Date.now()-(v.at||0)<172800000){bridge=v.bridge;token=v.token;topic=v.topic||'';return true}}catch(_){}return false}
async function timeoutFetch(url,opt={},ms=2600){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms),t=performance.now();try{const r=await fetch(url,{cache:'no-store',...opt,signal:ac.signal});latency=Math.round(performance.now()-t);return r}finally{clearTimeout(tm)}}
async function tailGet(path,ms=2200){const r=await timeoutFetch(TAIL+path,{},ms);if(!r.ok)throw Error('tail '+r.status);return r.json()}
async function tailPost(path,obj,ms=4200){const r=await timeoutFetch(TAIL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)},ms);let v={};try{v=await r.json()}catch(_){}if(!r.ok)throw Error('tail '+r.status);return v}
async function action(o){o.agent=agent;return tailPost('/action',o,5200)}
async function api(path,opt={},ms=3000){if(!bridge)throw Error('no bridge');const headers={...(opt.headers||{}),'Authorization':'Bearer '+token};return timeoutFetch(bridge+path,{...opt,headers},ms)}
function browserSelftest(){const checks={crypto:!!crypto?.getRandomValues,fetch:typeof fetch==='function',storage:(()=>{try{localStorage.setItem('archie.probe','1');localStorage.removeItem('archie.probe');return true}catch(_){return false}})(),editable:!!draft?.isContentEditable};return {ok:Object.values(checks).every(Boolean),checks}}
async function rendezvous(waitMs=18000){const until=Date.now()+waitMs;while(Date.now()<until){if(topic){try{const r=await timeoutFetch('https://ntfy.sh/'+encodeURIComponent(topic)+'/json?poll=1&since=all',{},1900);if(r.ok){const txt=await r.text();for(const line of txt.trim().split('\n').reverse()){try{const v=JSON.parse(line),m=JSON.parse(v.message||'{}');if(m.url&&m.token===token)return m.url.replace(/\/$/,'')}catch(_){}}}}catch(_){}}await sleep(450)}return ''}
async function bootstrap(){token=rand(32);topic='archie-'+rand(18).toLowerCase();bridge='';save();setStatus('opening native path');const h=await tailGet('/seat/head');agent=h.active_occupant||agent;try{await action({action:'timebox',seconds:900,label:'default-chat 15m phone field; temporal pressure only'})}catch(_){}
const cmd=`powershell -NoProfile -ExecutionPolicy Bypass -Command \"$u='${BRIDGE_RAW}';$p=Join-Path $env:TEMP 'archie_phone_bridge.py';Get-CimInstance Win32_Process | ? {$_.Name -match '^python' -and $_.CommandLine -like '*archie_phone_bridge.py*'} | % {Stop-Process -Id $_.ProcessId -Force};Invoke-WebRequest -UseBasicParsing $u -OutFile $p;py -3.12 $p --token '${token}' --topic '${topic}'\"`;
await action({action:'clipboard_set',text:cmd,value:cmd,clipboard:cmd});await action({action:'hotkey',keys:['win','r']});await sleep(300);await action({action:'hotkey',keys:['ctrl','v']});await sleep(100);let k=await action({action:'key',key:'enter'}).catch(()=>null);if(k&&k.ok===false)await action({action:'hotkey',keys:['enter']});setStatus('self-testing pc bridge');const u=await rendezvous(42000);if(!u)throw Error('bridge did not publish');bridge=u;save()}
async function bridgeSelftest(){const r=await api('/api/selftest',{},3200);let v={};try{v=await r.json()}catch(_){}if(!r.ok||!v.ok)throw Error('bridge selftest failed');return v}
function bind(path){if(path==='status')return statusText;if(path==='latency')return session?latency+'ms':'';let v=lastState;for(const p of String(path||'').split('.')){if(v==null)return '';v=v[p]}return v==null?'':String(v)}
function renderBindings(){for(const el of sceneEl.children){const v=bind(el.dataset.bind);el.textContent=v;el.style.display=(el.dataset.hide==='1'&&!v)?'none':''}}
function applyScene(v){if(!v||typeof v!=='object')return;const rev=Number(v.revision||0);if(rev===sceneRevision)return;sceneRevision=rev;features=v.features&&typeof v.features==='object'?v.features:{};liveStyle.textContent=typeof v.css==='string'?v.css.slice(0,80000):'';nodeFrame=Array.isArray(v.nodes)?v.nodes.slice(0,192):[];sceneEl.replaceChildren();for(const layer of Array.isArray(v.layers)?v.layers:[]){if(!layer||typeof layer!=='object')continue;const el=document.createElement(String(layer.tag||'div'));el.id='scene-'+String(layer.id||crypto.randomUUID());el.dataset.bind=String(layer.bind||'');el.dataset.hide=layer.hideEmpty?'1':'0';if(layer.class)el.className=String(layer.class);if(layer.style&&typeof layer.style==='object')Object.assign(el.style,layer.style);sceneEl.appendChild(el)}renderBindings()}
function drawNodes(){const dpr=Math.max(1,Math.min(3,devicePixelRatio||1)),w=nodes.clientWidth,h=nodes.clientHeight;if(nodes.width!==Math.round(w*dpr)||nodes.height!==Math.round(h*dpr)){nodes.width=Math.round(w*dpr);nodes.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);for(const n of nodeFrame){if(!n||typeof n!=='object')continue;ctx.globalAlpha=Math.max(0,Math.min(1,Number(n.alpha??1)));ctx.strokeStyle=String(n.stroke||'rgba(235,242,244,.5)');ctx.fillStyle=String(n.fill||'rgba(235,242,244,.14)');ctx.lineWidth=Math.max(.5,Number(n.line||1));if(n.kind==='line'){ctx.beginPath();ctx.moveTo(Number(n.x1||0)*w,Number(n.y1||0)*h);ctx.lineTo(Number(n.x2||0)*w,Number(n.y2||0)*h);ctx.stroke()}else if(n.kind==='ring'){ctx.beginPath();ctx.arc(Number(n.x||.5)*w,Number(n.y||.5)*h,Number(n.r||.03)*Math.min(w,h),0,Math.PI*2);if(n.fill)ctx.fill();ctx.stroke()}else if(n.kind==='text'){ctx.font=String(n.font||'11px ui-monospace');ctx.textAlign=String(n.align||'left');ctx.fillStyle=String(n.fill||'#eaf0f1');ctx.fillText(String(n.text||''),Number(n.x||0)*w,Number(n.y||0)*h)}}ctx.globalAlpha=1;requestAnimationFrame(drawNodes)}requestAnimationFrame(drawNodes)
function restartScreen(){if(!session)return;const src=bridge+'/api/screen.mjpg?t='+encodeURIComponent(token)+'&v='+Date.now();screen.src=src;screen.onload=()=>{screen.classList.add('live');screenBackoff=250};screen.onerror=()=>{screen.classList.remove('live');setTimeout(restartScreen,screenBackoff);screenBackoff=Math.min(4000,screenBackoff*1.6)}}
async function connect(){if(connecting||!bridge||!token)return false;connecting=true;try{await bridgeSelftest();const r=await api('/api/session',{method:'POST'},3200);if(!r.ok)throw Error('session');session=true;generation++;save();root.classList.add('entered');setState('online');setStatus('live');restartScreen();const g=generation;stateLoop(g);if(features.micAutostart!==false)startMic();if(pendingDraft)flushDraft();return true}catch(e){session=false;setState('degraded');setStatus('reconnecting');return false}finally{connecting=false}}
async function recoverForever(){while(started){if(session){await sleep(700);continue}if(bridge&&token&&await connect()){continue}if(topic&&token){const u=await rendezvous(3500);if(u){bridge=u;save();continue}}if(!bridge){try{await bootstrap();continue}catch(_){setStatus('waiting for native path')}}await sleep(1400)}}
async function stateLoop(g){let miss=0;while(session&&g===generation){try{const r=await api('/api/state?g='+g,{},2200);if(!r.ok)throw Error('state');lastState=await r.json();applyScene(lastState.scene);renderBindings();const reply=lastState.seat?.reply||{};setState('online',reply.done===false||lastState.bus?.active?'working':'',lastState.bus?.active?'typing':'');setStatus(lastState.bus?.event||'live');miss=0}catch(_){miss++;if(miss>5){session=false;generation++;setState('degraded');setStatus('reconnecting');break}}await sleep(75)}}
function resample(input,from,to=16000){if(from===to)return input;const ratio=from/to,n=Math.max(1,Math.floor(input.length/ratio)),out=new Float32Array(n);for(let i=0;i<n;i++){const a=Math.floor(i*ratio),b=Math.min(input.length-1,Math.floor((i+1)*ratio));let sum=0,c=0;for(let j=a;j<=b;j++){sum+=input[j];c++}out[i]=c?sum/c:0}return out}
function pcm16(f){const a=new Int16Array(f.length);for(let i=0;i<f.length;i++){const x=Math.max(-1,Math.min(1,f[i]));a[i]=x<0?x*32768:x*32767}return a.buffer}
async function startMic(){if(micOn)return;try{micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});audioCtx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});source=audioCtx.createMediaStreamSource(micStream);processor=audioCtx.createScriptProcessor(1024,1,1);processor.onaudioprocess=e=>{if(!micOn||!session)return;const f=resample(e.inputBuffer.getChannelData(0),audioCtx.sampleRate,16000);fetch(bridge+'/api/audio?rate=16000',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/octet-stream'},body:pcm16(f),cache:'no-store'}).catch(()=>{})};source.connect(processor);processor.connect(audioCtx.destination);micOn=true;mic.classList.add('live')}catch(e){setStatus('mic unavailable')}}
function stopMic(){micOn=false;mic.classList.remove('live');if(processor)try{processor.disconnect()}catch(_){}if(source)try{source.disconnect()}catch(_){}if(micStream)micStream.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close().catch(()=>{});processor=source=micStream=audioCtx=null}mic.onclick=()=>micOn?stopMic():startMic();
async function pushDraft(final=false){const text=(draft.innerText||'').replace(/\u00a0/g,' ');if(text===lastDraft&&!final)return;lastDraft=text;revision++;const payload={stream_id:inputStream,revision,text,final};pendingDraft=payload;root.classList.add('typing');if(session){try{const r=await api('/api/text-stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)},1500);if(r.ok)pendingDraft=null}catch(_){session=false}}if(final){draft.innerHTML='';lastDraft='';inputStream=crypto.randomUUID();revision=0;root.classList.remove('typing')}}
async function flushDraft(){if(!pendingDraft||!session)return;try{const r=await api('/api/text-stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pendingDraft)},1600);if(r.ok)pendingDraft=null}catch(_){}}
draft.addEventListener('input',()=>pushDraft(false));draft.addEventListener('compositionend',()=>pushDraft(false));draft.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();pushDraft(true)}});
let down=null;screen.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()}});screen.addEventListener('pointerup',e=>{if(!down||features.screenTap===false||!session)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)<14&&performance.now()-down.t<650){const r=screen.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width,ny=(e.clientY-r.top)/r.height;api('/api/pointer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nx,ny,button:'left'})},2200).catch(()=>{})}down=null});
$('seed').onclick=async()=>{if(started)return;const b=browserSelftest();if(!b.ok){setStatus('browser selftest failed');return}started=true;root.classList.add('entered');setStatus('self-testing');const p=params();bridge=p.get('bridge')||'';token=p.get('token')||'';topic=p.get('topic')||'';if(!(bridge&&token))restore();recoverForever()};
})();
</script></body></html>
