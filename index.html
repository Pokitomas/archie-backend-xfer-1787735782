<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>field</title>
<style id="base">
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#000;color:#fff}body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-tap-highlight-color:transparent}#root{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#000}#screen{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;pointer-events:none;transition:opacity .06s linear}#screen.live{opacity:1}#scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#layers{position:absolute;inset:0;pointer-events:none}.scene-layer{position:absolute;white-space:pre-wrap;overflow:hidden;pointer-events:none}#ink{position:absolute;z-index:5;left:17vw;right:4.8vw;bottom:calc(3.4vh + env(safe-area-inset-bottom));height:19vh;min-height:104px;padding:13px 3px 12px;margin:0;border:0;border-radius:0;outline:0;background:transparent;color:rgba(246,249,250,.98);caret-color:#fff;font:500 17px/1.28 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.035em;resize:none;-webkit-appearance:none;appearance:none;box-shadow:none}#ink::placeholder{color:transparent}#key{position:absolute;z-index:7;left:4.7vw;bottom:calc(6.3vh + env(safe-area-inset-bottom));width:54px;height:54px;border:0;padding:0;border-radius:50%;background:rgba(255,255,255,.028);box-shadow:inset 0 0 0 1px rgba(242,247,248,.16);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:0}#key:before{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(245,249,250,.9);box-shadow:-9px 0 0 -1px rgba(245,249,250,.3),9px 0 0 -1px rgba(245,249,250,.3),0 -9px 0 -1px rgba(245,249,250,.3),0 9px 0 -1px rgba(245,249,250,.3)}#key.held{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(242,247,248,.4),0 0 0 7px rgba(242,247,248,.02)}
</style><style id="sceneStyle"></style>
</head>
<body><div id="root"><img id="screen" alt=""><canvas id="scene"></canvas><div id="layers"></div><textarea id="ink" aria-label="field adapter input" autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true" enterkeyhint="send"></textarea><button id="key" aria-label="field adapter control"></button></div>
<script src="field_kernel.js"></script>
<script src="field_surface.js"></script>
<script src="field_ios_adapter.js"></script>
<script src="field_client.js"></script>
</body></html>
