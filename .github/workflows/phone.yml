name: phone-field
on:
  push:
    branches: [master]
    paths:
      - index.html
      - field_kernel.js
      - field_surface.js
      - field_ios_adapter.js
      - field_client.js
      - field_bootstrap.ps1
      - phone_bridge.py
      - phone_bridge_fast.py
      - phone_bridge_field.py
      - field_controller_adapters.py
      - field_entry_server.py
      - field_mcp.py
      - field_protocol.py
      - field_transport.py
      - native_aperture.py
      - native_secret.py
      - native_resident.py
      - native_field_server.py
      - native_index.html
      - native_field_client.js
      - field_acme.ps1
      - phone_scene.json
      - phone_selftest.py
      - test_phone_bridge_fast.py
      - test_phone_bridge_field.py
      - test_field_entry_server.py
      - test_field_mcp.py
      - test_field_protocol.py
      - test_native_aperture.py
      - test_native_resident.py
      - acoustic_field.py
      - test_acoustic_field.py
      - activity_field.py
      - test_activity_field.py
      - live_field.py
      - test_live_field.py
      - .github/workflows/phone.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile phone_bridge.py phone_bridge_fast.py phone_bridge_field.py field_controller_adapters.py field_entry_server.py field_mcp.py field_protocol.py field_transport.py native_aperture.py native_secret.py native_resident.py native_field_server.py phone_selftest.py test_phone_bridge_fast.py test_phone_bridge_field.py test_field_entry_server.py test_field_mcp.py test_field_protocol.py test_native_aperture.py test_native_resident.py acoustic_field.py test_acoustic_field.py activity_field.py test_activity_field.py live_field.py test_live_field.py
      - name: Bridge contract
        run: python phone_selftest.py
      - name: Fast bridge contract
        run: python test_phone_bridge_fast.py
      - name: Generic field contract
        run: python test_live_field.py
      - name: Shared field envelope contract
        run: python test_field_protocol.py
      - name: Field bridge contract
        run: python test_phone_bridge_field.py
      - name: Zero-history MCP contract
        run: python test_field_mcp.py
      - name: MCP HTTP aperture contract
        run: python test_field_entry_server.py
      - name: Native network packet contract
        run: python test_native_aperture.py
      - name: Native resident contract
        run: python test_native_resident.py
      - name: Acoustic adapter contract
        run: python test_acoustic_field.py
      - name: Activity adapter contract
        run: python test_activity_field.py
      - name: Static field contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          html=Path('index.html').read_text(encoding='utf-8')
          client=Path('field_client.js').read_text(encoding='utf-8')
          kernel=Path('field_kernel.js').read_text(encoding='utf-8')
          surface=Path('field_surface.js').read_text(encoding='utf-8')
          adapter=Path('field_ios_adapter.js').read_text(encoding='utf-8')
          field=Path('phone_bridge_field.py').read_text(encoding='utf-8')
          machine_adapters=Path('field_controller_adapters.py').read_text(encoding='utf-8')
          entry=Path('field_entry_server.py').read_text(encoding='utf-8')
          mcp=Path('field_mcp.py').read_text(encoding='utf-8')
          core=Path('live_field.py').read_text(encoding='utf-8')
          protocol=Path('field_protocol.py').read_text(encoding='utf-8')
          transport=Path('field_transport.py').read_text(encoding='utf-8')
          boot=Path('field_bootstrap.ps1').read_text(encoding='utf-8')

          for name in ['field_kernel.js','field_surface.js','field_ios_adapter.js','field_client.js']:
              assert name in html,name
          assert html.lower().count('<button') == 1
          assert 'id="fallback"' not in html and 'id="retry"' not in html and 'id="dock"' not in html
          assert 'ARCHIE_FIELD_CORE' in kernel and '/api/field.ndjson' in kernel and '/api/field' in kernel
          assert 'ARCHIE_FIELD_SURFACE' in surface
          assert 'ARCHIE_FIELD_ADAPTER' in adapter
          assert 'field_bootstrap.ps1' in client and 'native cutover not announced' in client
          assert 'vercel.app' not in (html+client+kernel+surface+adapter).lower()
          assert '/api/pointer' not in (client+kernel+surface+adapter)
          for forbidden in ['getUserMedia','pcm_s16le','utf8','speechSynthesis','textarea','phone/audio','phone/text']:
              assert forbidden not in kernel,('kernel modality leak',forbidden)
          for forbidden in ['getUserMedia','pcm_s16le','utf8','compositionstart']:
              assert forbidden not in client,('entry duplication',forbidden)
          for forbidden in ['getUserMedia','pcm_s16le','utf8','compositionstart']:
              assert forbidden not in surface,('surface modality leak',forbidden)
          assert 'getUserMedia' in adapter and 'compositionstart' in adapter

          assert "class LiveField" in core
          assert 'from field_protocol import FieldRecord' in core
          assert 'import field_protocol as protocol' in transport
          assert 'def safe(' in protocol and 'class FieldRecord' in protocol
          for word in ['speechSynthesis','ImageGrab','controller_action','phone/audio','phone/text']:
              assert word not in core,word
          for word in ['phone/audio','phone/text','pcm_s16le','utf8']:
              assert word not in field,('aperture modality leak',word)
          assert 'field_controller_adapters' in field and "_ADAPTERS.get(shape)" in field
          assert 'phone/audio' in machine_adapters and 'phone/text' in machine_adapters
          assert 'X-Field-Meta' in field

          assert "urlparse(self.path).path == '/mcp'" in entry
          assert "'name': 'enter_controller'" in mcp
          assert 'No prior chat context' in mcp
          assert 'EVERY user turn' in mcp and 'message_semantics_gate_entry' in mcp
          assert 'py_compile' in boot and 'run_selftest' in boot and 'candidate-refused' in boot and 'Wait-Native' in boot
          assert 'migration_transport_retired' in boot and 'Stop-HostedRuntime' in boot and 'Publish-Cutover' in boot
          assert 'field_controller_adapters.py' in boot and 'field_kernel.js' in boot

          scene=json.loads(Path('phone_scene.json').read_text(encoding='utf-8'))
          feat=scene.get('features',{})
          assert int(scene.get('revision',0)) >= 6
          assert feat.get('fieldProtocol') is True
          assert feat.get('arbitraryChannels') is True
          assert feat.get('arbitraryShapes') is True
          assert feat.get('singleControl') is True
          assert feat.get('screenInteraction') is False
          assert feat.get('clientOutputActuation') is False
          assert feat.get('boundedOfflinePayloads') is True
          print('field contracts ok',len(html),len(kernel),len(surface),len(adapter),len(client),len(field))
          PY
      - name: Native direct surface contract
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=['native_aperture.py','native_resident.py','native_field_server.py','native_index.html','native_field_client.js','field_kernel.js','field_surface.js','field_ios_adapter.js']
          native='\n'.join(Path(p).read_text(encoding='utf-8') for p in paths).lower()
          for bad in ['vercel.app','trycloudflare.com','cloudflared','ntfy.sh','tail1bf489','raw.githubusercontent.com','raw.githack']:
              assert bad not in native,bad
          html=Path('native_index.html').read_text(encoding='utf-8')
          client=Path('native_field_client.js').read_text(encoding='utf-8')
          server=Path('native_field_server.py').read_text(encoding='utf-8')
          assert html.lower().count('<button')==1
          for src in ['/field-kernel.js','/field-surface.js','/field-ios.js','/field.js']:
              assert src in html,src
          assert 'location.origin' in client and 'ARCHIE_FIELD_ENDPOINT' in client
          assert '/api/field.ndjson' not in client
          assert 'machine.readiness' in server and "'hosted_relay': False" in server
          assert '/api/pointer' not in native and 'speechSynthesis' not in native
          print('native direct surface contract ok')
          PY
      - name: Browser script syntax
        run: |
          node --check field_kernel.js
          node --check field_surface.js
          node --check field_ios_adapter.js
          node --check field_client.js
          node --check native_field_client.js
      - name: Windows migration and ACME syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content -Raw field_bootstrap.ps1))
          $null = [scriptblock]::Create((Get-Content -Raw field_acme.ps1))
          Write-Host 'powershell parse ok'
