name: phone-field
on:
  push:
    branches: [master]
    paths:
      - index.html
      - phone_bridge.py
      - phone_scene.json
      - phone_selftest.py
      - .github/workflows/phone.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile phone_bridge.py phone_selftest.py
      - name: Bridge contract
        run: python phone_selftest.py
      - name: Static shell contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          required=['/api/selftest','recoverForever','text-stream','screen.mjpg','applyScene','/api/pointer','liveStyle']
          assert all(x in s for x in required), [x for x in required if x not in s]
          assert 'vercel.app' not in s.lower()
          assert 'id="fallback"' not in s and 'id="retry"' not in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(scripts)==1
          Path('/tmp/phone.js').write_text(scripts[0],encoding='utf-8')
          print('static shell contract ok',len(s),len(scripts[0]))
          PY
      - name: Browser script syntax
        run: node --check /tmp/phone.js
