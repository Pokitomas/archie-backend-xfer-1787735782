name: phone-field
on:
  push:
    branches: [master]
    paths:
      - index.html
      - field_client.js
      - field_bootstrap.ps1
      - phone_bridge.py
      - phone_bridge_fast.py
      - phone_bridge_field.py
      - phone_scene.json
      - phone_selftest.py
      - test_phone_bridge_fast.py
      - test_phone_bridge_field.py
      - acoustic_field.py
      - test_acoustic_field.py
      - activity_field.py
      - test_activity_field.py
      - live_field.py
      - test_live_field.py
      - .github/workflows/phone.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile phone_bridge.py phone_bridge_fast.py phone_bridge_field.py phone_selftest.py test_phone_bridge_fast.py test_phone_bridge_field.py acoustic_field.py test_acoustic_field.py activity_field.py test_activity_field.py live_field.py test_live_field.py
      - name: Bridge contract
        run: python phone_selftest.py
      - name: Fast bridge contract
        run: python test_phone_bridge_fast.py
      - name: Generic field contract
        run: python test_live_field.py
      - name: Field bridge contract
        run: python test_phone_bridge_field.py
      - name: Acoustic adapter contract
        run: python test_acoustic_field.py
      - name: Activity adapter contract
        run: python test_activity_field.py
      - name: Static field contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('field_client.js').read_text(encoding='utf-8')
          field=Path('phone_bridge_field.py').read_text(encoding='utf-8')
          core=Path('live_field.py').read_text(encoding='utf-8')
          boot=Path('field_bootstrap.ps1').read_text(encoding='utf-8')
          assert 'field_client.js' in html and 'phone_client.js' not in html
          assert html.lower().count('<button') == 1
          assert 'id="fallback"' not in html and 'id="retry"' not in html and 'id="dock"' not in html
          required=['/api/field','/api/field.ndjson','ARCHIE_FIELD','recoverForever','screen.mjpg','applyScene','compositionstart','visualViewport','field_bootstrap.ps1']
          assert all(x in js for x in required), [x for x in required if x not in js]
          for legacy in ['/api/text-stream','/api/audio','/api/voice-state','/api/reply.ndjson','/api/activity.ndjson']:
              assert legacy not in js, legacy
          assert 'vercel.app' not in (html+js).lower()
          assert '/api/pointer' not in js and 'pointerAction' not in js
          for forbidden in ['speechSynthesis','new Audio(','<audio','.play(']:
              assert forbidden not in html+js, forbidden
          assert "class LiveField" in core
          for word in ['speechSynthesis','ImageGrab','controller_action','phone/audio','phone/text']:
              assert word not in core, word
          assert "path == '/api/field.ndjson'" in field and "path != '/api/field'" in field
          assert "_ADAPTERS.get(shape)" in field
          assert 'py_compile' in boot and 'run_selftest' in boot and 'candidate-refused' in boot and 'Wait-FieldHealth' in boot
          scene=json.loads(Path('phone_scene.json').read_text(encoding='utf-8'))
          feat=scene.get('features',{})
          assert int(scene.get('revision',0)) >= 5
          assert feat.get('fieldProtocol') is True
          assert feat.get('arbitraryChannels') is True
          assert feat.get('arbitraryShapes') is True
          assert feat.get('singleControl') is True
          assert feat.get('screenInteraction') is False
          assert feat.get('outputAudioOnPhone') is False
          binds={x.get('bind') for x in scene.get('layers',[]) if isinstance(x,dict)}
          assert 'field.controller.primary.payload.reply.text' in binds
          assert 'field.machine.state.payload.focus' in binds
          print('field contracts ok',len(html),len(js),len(field),len(core))
          PY
      - name: Browser script syntax
        run: node --check field_client.js
      - name: Windows bootstrap syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content -Raw field_bootstrap.ps1))
          Write-Host 'bootstrap parse ok'
