name: controller-close
on:
  push:
    paths:
      - '.github/workflows/controller-close.yml'
jobs:
  close:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Close Edge and Roblox
        uses: actions/github-script@v7
        with:
          script: |
            const cp = require('child_process');
            const attempts = [];
            function run(bin,args){
              try { const out=cp.execFileSync(bin,args,{encoding:'utf8',stdio:['ignore','pipe','pipe']}); attempts.push({bin,args,ok:true,out}); }
              catch(e){ attempts.push({bin,args,ok:false,code:e.status,stderr:String(e.stderr||''),stdout:String(e.stdout||'')}); }
            }
            if (process.platform === 'win32') {
              run('taskkill.exe',['/F','/IM','msedge.exe']);
              run('taskkill.exe',['/F','/IM','RobloxPlayerBeta.exe']);
              run('taskkill.exe',['/F','/IM','RobloxStudioBeta.exe']);
            } else {
              run('/mnt/c/Windows/System32/taskkill.exe',['/F','/IM','msedge.exe']);
              run('/mnt/c/Windows/System32/taskkill.exe',['/F','/IM','RobloxPlayerBeta.exe']);
              run('/mnt/c/Windows/System32/taskkill.exe',['/F','/IM','RobloxStudioBeta.exe']);
              run('powershell.exe',['-NoProfile','-Command',"Get-Process msedge,RobloxPlayerBeta,RobloxStudioBeta -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue"]);
            }
            console.log(JSON.stringify({platform:process.platform,attempts},null,2));
