name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe resolve pocket contract
        shell: bash
        run: |
          set -u
          out=/tmp/recovery-probe; mkdir -p "$out"
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          cat > "$out/read.json" <<'EOF'
          {"action":"packet.read","spec":{}}
          EOF
          cat > "$out/write-empty.json" <<'EOF'
          {"action":"packet.write","spec":{}}
          EOF
          cat > "$out/write-text.json" <<'EOF'
          {"action":"packet.write","spec":{"text":"Recover the local ARCHIE controller and field worker, verify /health and /seat/head, preserve current operator state."}}
          EOF
          cat > "$out/write-request.json" <<'EOF'
          {"action":"packet.write","spec":{"request":"Recover the local ARCHIE controller and field worker, verify /health and /seat/head, preserve current operator state."}}
          EOF
          cat > "$out/write-intent.json" <<'EOF'
          {"action":"packet.write","spec":{"intent":"Recover the local ARCHIE controller and field worker, verify /health and /seat/head, preserve current operator state.","mode":"repair"}}
          EOF
          for f in "$out"/*.json; do n=$(basename "$f" .json); curl -k -L --connect-timeout 5 --max-time 15 -sS -H 'content-type: application/json' --data-binary @"$f" "$root" > "$out/$n.result.json"; echo $? > "$out/$n.rc"; done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
