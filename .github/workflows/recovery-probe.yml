name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read backend through allowed ring surfaces
        shell: bash
        run: |
          set +e
          out=/tmp/recovery-probe
          rm -rf "$out"
          mkdir -p "$out"
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          for action in status.read signal.read driver.read field.read controller.read packet.read phone.capabilities; do
            n=${action//./-}
            printf '{"action":"%s"}' "$action" > "$out/$n.request.json"
            curl -k -L --connect-timeout 4 --max-time 12 -sS -H 'content-type: application/json' --data-binary @"$out/$n.request.json" "$root" > "$out/$n.result.json"
            printf '%s rc=%s bytes=%s\n' "$action" "$?" "$(wc -c < "$out/$n.result.json")" > "$out/$n.meta"
          done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
