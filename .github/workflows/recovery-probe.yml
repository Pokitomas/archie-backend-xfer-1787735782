name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect live phone hand client contract
        shell: bash
        run: |
          set -u
          out=/tmp/recovery-probe; mkdir -p "$out"
          base='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone'
          for p in hands.html hands.js hands.css index.html app.js; do n=${p//./_}; curl -k -L --connect-timeout 5 --max-time 12 -sS -D "$out/$n.headers" "$base/$p" -o "$out/$n.body"; echo $? > "$out/$n.rc"; done
          grep -nEi 'desktop\.key|desktop\.tap|v1/action|key not allowed|key:' "$out/hands_js.body" > "$out/key-hints.txt" || true
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
