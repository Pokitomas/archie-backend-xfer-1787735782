name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Follow recovery packet and enter terminal directly
        shell: bash
        run: |
          set -u
          out=/tmp/recovery-probe; mkdir -p "$out"
          base='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone'
          root="$base/v1/action"
          sleep 2
          cat > "$out/read.json" <<'EOF'
          {"action":"packet.read"}
          EOF
          cat > "$out/status.json" <<'EOF'
          {"action":"status.read"}
          EOF
          cat > "$out/field.json" <<'EOF'
          {"action":"field.read"}
          EOF
          cat > "$out/tap.json" <<'EOF'
          {"action":"desktop.tap","x":0.62734,"y":0.97778}
          EOF
          for n in read status field tap; do curl -k -L --connect-timeout 5 --max-time 18 -sS -H 'content-type: application/json' --data-binary @"$out/$n.json" "$root" > "$out/$n.result.json"; echo $? > "$out/$n.rc"; done
          sleep 2
          curl -k -L --connect-timeout 5 --max-time 12 -sS "$base/shot" -o "$out/after.jpg" || true
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
