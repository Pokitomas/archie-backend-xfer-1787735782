name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prove live PC actuation through ring
        shell: bash
        run: |
          set +e
          out=/tmp/recovery-probe; rm -rf "$out"; mkdir -p "$out"
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          cat > "$out/focus.json" <<'EOF'
          {"action":"desktop.focus_resolve","spec":{}}
          EOF
          curl -k -L --connect-timeout 4 --max-time 20 -sS -H 'content-type: application/json' --data-binary @"$out/focus.json" "$root" > "$out/focus.result.json"; echo $? > "$out/focus.rc"
          cat > "$out/inspect.json" <<'EOF'
          {"action":"controller.action","spec":{"action":"inspect","limit":60,"agent":"gpt56sol-ring","role":"measure","intent":"prove live PC actuation"}}
          EOF
          curl -k -L --connect-timeout 4 --max-time 20 -sS -H 'content-type: application/json' --data-binary @"$out/inspect.json" "$root" > "$out/inspect.result.json"; echo $? > "$out/inspect.rc"
          cat > "$out/status.json" <<'EOF'
          {"action":"status.read"}
          EOF
          curl -k -L --connect-timeout 4 --max-time 12 -sS -H 'content-type: application/json' --data-binary @"$out/status.json" "$root" > "$out/status.result.json"; echo $? > "$out/status.rc"
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
