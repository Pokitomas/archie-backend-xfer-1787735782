name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enter surviving desktop and resolve packet path
        shell: bash
        run: |
          set -u
          out=/tmp/recovery-probe; mkdir -p "$out"
          base='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone'
          root="$base/v1/action"
          cat > "$out/p0.json" <<'EOF'
          {"action":"packet.write","packet":{}}
          EOF
          cat > "$out/p1.json" <<'EOF'
          {"action":"packet.write","packet":{"schema":"archie-resolve-pocket/v2"}}
          EOF
          cat > "$out/p2.json" <<'EOF'
          {"action":"packet.write","packet":{"schema":"archie-resolve-pocket/v2","status":"requested","request":"Recover the local ARCHIE controller and field worker, verify /health and /seat/head, preserve current operator state."}}
          EOF
          cat > "$out/p3.json" <<'EOF'
          {"action":"packet.write","packet":{"schema":"archie-resolve-pocket/v2","status":"requested","intent":"Recover the local ARCHIE controller and field worker, verify /health and /seat/head, preserve current operator state.","action":"repair"}}
          EOF
          for f in "$out"/p*.json; do n=$(basename "$f" .json); curl -k -L --connect-timeout 5 --max-time 15 -sS -H 'content-type: application/json' --data-binary @"$f" "$root" > "$out/$n.result.json"; echo $? > "$out/$n.rc"; done
          cat > "$out/tap.json" <<'EOF'
          {"action":"desktop.tap","spec":{"x":0.62734,"y":0.97778}}
          EOF
          curl -k -L --connect-timeout 5 --max-time 15 -sS -H 'content-type: application/json' --data-binary @"$out/tap.json" "$root" > "$out/tap.result.json"; echo $? > "$out/tap.rc"
          sleep 2
          curl -k -L --connect-timeout 5 --max-time 12 -sS "$base/shot" -o "$out/after.jpg" || true
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
