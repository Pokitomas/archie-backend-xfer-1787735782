name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe surviving recovery surfaces
        shell: bash
        run: |
          set -u
          out=/tmp/recovery-probe
          mkdir -p "$out"
          phone='https://desktop-6fn9b4m.tail1bf489.ts.net'
          power='https://desktop-6fn9b4m-1.tail1bf489.ts.net:8443'
          probe(){ n="$1"; u="$2"; curl -k -L --connect-timeout 5 --max-time 12 -sS -D "$out/$n.headers" "$u" -o "$out/$n.body"; echo $? > "$out/$n.rc"; }
          probe phone_health "$phone/archie-phone/health" || true
          probe postchat "$phone/postchat/" || true
          probe postchat_health "$phone/postchat/health" || true
          probe maker "$phone/maker/" || true
          probe power_root "$power/" || true
          probe power_status "$power/status" || true
          probe power_health "$power/health" || true
          probe power_control "$power/control.html" || true
          probe power_console "$power/console.html" || true
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
