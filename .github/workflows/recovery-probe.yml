name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect surviving phone shell
        shell: bash
        run: |
          set -u
          base='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/'
          out=/tmp/recovery-probe
          mkdir -p "$out"
          curl -k -L --max-time 15 -sS "$base.well-known/archie-phone.json" -o "$out/well-known.json" || true
          curl -k -L --max-time 15 -sS "$base" -o "$out/index.html" || true
          src=$(grep -oE '<script[^>]+src="[^"]+"' "$out/index.html" | head -1 | sed -E 's/.*src="([^"]+)".*/\1/' || true)
          if [ -n "$src" ]; then curl -k -L --max-time 15 -sS "$base${src#./}" -o "$out/hands.js" || true; fi
          grep -nEi 'restart|bootstrap|repair|service|native_terminal|controller\.|push\.|training|workspace_patch|action[:=]|call\(' "$out/hands.js" 2>/dev/null | head -500 > "$out/action-hints.txt" || true
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
