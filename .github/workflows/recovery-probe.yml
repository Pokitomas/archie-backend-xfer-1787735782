name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Measure desktop ring HTTP and receipts
        shell: bash
        run: |
          set +e
          out=/tmp/recovery-probe; rm -rf "$out"; mkdir -p "$out"
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          probe(){
            label="$1"; data="$2"
            printf '%s' "$data" > "$out/$label.request.json"
            curl -k -L -sS --connect-timeout 4 --max-time 12 -D "$out/$label.headers" -o "$out/$label.body" -w '%{http_code}\n' -H 'content-type: application/json' --data-binary @"$out/$label.request.json" "$root" > "$out/$label.http"
            echo $? > "$out/$label.rc"
          }
          probe status0 '{"action":"status.read"}'
          probe keyf24 '{"action":"desktop.key","spec":{"key":"f24"}}'
          probe keyesc '{"action":"desktop.key","spec":{"key":"esc"}}'
          probe driver '{"action":"driver.read"}'
          probe signal '{"action":"signal.read"}'
          probe caps '{"action":"phone.capabilities"}'
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
