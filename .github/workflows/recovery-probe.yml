name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query surviving bridge-local capability plane
        shell: bash
        run: |
          set -u
          out=/tmp/recovery-probe
          mkdir -p "$out"
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          for action in status.read signal.read driver.read field.read phone.capabilities ios.inventory; do
            n=${action//./_}
            python - "$action" <<'PY' > "$out/$n.request.json"
          import json,sys
          print(json.dumps({'action':sys.argv[1],'spec':{}},separators=(',',':')))
          PY
            curl -k -L --connect-timeout 5 --max-time 18 -sS -H 'content-type: application/json' --data-binary @"$out/$n.request.json" "$root" > "$out/$n.result.json"; echo $? > "$out/$n.rc"
          done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
