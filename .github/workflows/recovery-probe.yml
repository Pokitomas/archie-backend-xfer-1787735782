name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: go in through the live relay
        shell: bash
        run: |
          set -Eeuo pipefail
          out=/tmp/recovery-probe; rm -rf "$out"; mkdir -p "$out"
          cat > "$out/pc-script.sh" <<'PC'
          #!/usr/bin/env bash
          set +e
          stamp="$(date -Is)"
          root="$HOME/.local/share/gpt56-ring"
          mkdir -p "$HOME/.local/bin" "$root"

          cat > "$HOME/.local/bin/gpt56-ring-enter" <<'RING'
          #!/usr/bin/env bash
          set +e
          printf '\nARCHIE RING ENTRY\nhost=%s time=%s\n' "$(hostname)" "$(date -Is)"

          if systemctl --user cat archie-ring.target >/dev/null 2>&1; then
            systemctl --user start archie-ring.target >/dev/null 2>&1 || true
            printf '%-34s %s\n' archie-ring.target "$(systemctl --user is-active archie-ring.target 2>/dev/null || true)"
          fi

          for u in archie-ingress.service archie-runtime-truth.service archie-live-exec.service archie-toolbus.service; do
            if systemctl --user cat "$u" >/dev/null 2>&1; then
              systemctl --user restart "$u" >/dev/null 2>&1 || systemctl --user start "$u" >/dev/null 2>&1 || true
              printf '%-34s %s\n' "$u" "$(systemctl --user is-active "$u" 2>/dev/null || true)"
            else
              printf '%-34s %s\n' "$u" missing
            fi
          done

          echo
          echo '--- seat ---'
          curl -fsS --max-time 2 http://127.0.0.1:8798/seat/head 2>/dev/null || echo 'seat/head unavailable'
          echo
          echo '------------'

          if [[ -x "$HOME/JOIN_ARCHIE" ]]; then
            exec "$HOME/JOIN_ARCHIE" gpt56sol
          elif [[ -f "$HOME/JOIN_ARCHIE" ]]; then
            exec bash "$HOME/JOIN_ARCHIE" gpt56sol
          else
            echo 'JOIN_ARCHIE missing; resident shell only'
            exec bash -l
          fi
          RING
          chmod 700 "$HOME/.local/bin/gpt56-ring-enter"

          if systemctl --user cat archie-ring.target >/dev/null 2>&1; then
            systemctl --user start archie-ring.target >/dev/null 2>&1 || true
          fi
          for u in archie-ingress.service archie-runtime-truth.service archie-live-exec.service archie-toolbus.service; do
            if systemctl --user cat "$u" >/dev/null 2>&1; then
              systemctl --user restart "$u" >/dev/null 2>&1 || systemctl --user start "$u" >/dev/null 2>&1 || true
            fi
          done

          receipt="$root/entry-receipt.txt"
          {
            echo "directive=go in"
            echo "at=$stamp"
            echo "host=$(hostname)"
            echo "ring_script=$(test -x "$HOME/.local/bin/gpt56-ring-enter" && echo installed || echo missing)"
            echo "join_archie=$(test -e "$HOME/JOIN_ARCHIE" && echo present || echo missing)"
            printf 'ring_target=%s\n' "$(systemctl --user is-active archie-ring.target 2>/dev/null || echo absent)"
            for u in archie-ingress.service archie-runtime-truth.service archie-live-exec.service archie-toolbus.service; do
              printf '%s=%s\n' "$u" "$(systemctl --user is-active "$u" 2>/dev/null || echo missing)"
            done
            printf 'seat_head='; curl -fsS --max-time 2 http://127.0.0.1:8798/seat/head 2>/dev/null || echo unavailable
            echo
            echo 'processes:'
            ps -eo pid,ppid,etimes,cmd | grep -Ei '[a]rchie-(ingress|runtime-truth|live-exec|toolbus)|[r]oom.py join gpt56sol' | head -80
          } > "$receipt" 2>&1
          cp "$receipt" /mnt/c/Users/AwesomeKai/Desktop/ARCHIE_RING_ENTRY_RECEIPT.txt 2>/dev/null || true

          core_ok=1
          for u in archie-ingress.service archie-runtime-truth.service archie-live-exec.service archie-toolbus.service; do
            [[ "$(systemctl --user is-active "$u" 2>/dev/null)" == active ]] || core_ok=0
          done
          if [[ "$core_ok" == 1 ]]; then
            curl -sS --max-time 8 'https://archie-gpt56-ring-relay.vercel.app/api/proxy' >/dev/null 2>&1 || true
          fi
          if curl -fsS --max-time 2 http://127.0.0.1:8798/seat/head >/dev/null 2>&1; then
            curl -sS --max-time 8 'https://archie-gpt56-door-proxy.vercel.app/api/proxy' >/dev/null 2>&1 || true
          fi

          cmd.exe /c start "" "%LOCALAPPDATA%\ARCHIE-Ring\ENTER_ARCHIE.cmd" >/dev/null 2>&1 || \
            cmd.exe /c start "" wt.exe wsl.exe -e bash -lc "~/.local/bin/gpt56-ring-enter" >/dev/null 2>&1 || true
          PC
          chmod +x "$out/pc-script.sh"
          b64=$(base64 -w0 "$out/pc-script.sh")
          export PC_CMD="printf '%s' '$b64' | base64 -d | bash"
          python3 - <<'PY' > "$out/request.json"
          import base64,json,os
          cmd=os.environ['PC_CMD']
          print(json.dumps({
            'cmd':cmd,
            'command':cmd,
            'goal':cmd,
            'b':base64.urlsafe_b64encode(cmd.encode()).decode().rstrip('='),
            'intent':'go in; repair canonical ARCHIE ring entry and enter it'
          },separators=(',',':')))
          PY
          curl -sS -i --connect-timeout 8 --max-time 45 \
            -X POST -H 'content-type: application/json' \
            --data-binary @"$out/request.json" \
            'https://archie-chatgpt-relay.vercel.app/api' > "$out/response.txt"
          cat "$out/response.txt"
          grep -q '"ok":true' "$out/response.txt"
          sleep 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
