name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe Codex result only through live ring ingress
        shell: bash
        run: |
          set +e
          out=/tmp/recovery-probe; rm -rf "$out"; mkdir -p "$out"
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          for action in status.read phone.capabilities controller.read field.read driver.read packet.read signal.read; do
            printf '{"action":"%s"}\n' "$action" > "$out/$action.request.json"
            curl -k -L --connect-timeout 4 --max-time 18 -sS -w '\n__HTTP__=%{http_code} __TIME__=%{time_total}\n' \
              -H 'content-type: application/json' --data-binary @"$out/$action.request.json" "$root" > "$out/$action.result.txt" 2>"$out/$action.err"
            echo $? > "$out/$action.rc"
          done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
