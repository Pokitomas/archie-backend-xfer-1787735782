name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Map surviving tailscale serve routes
        shell: bash
        run: |
          set -u
          out=/tmp/recovery-probe; mkdir -p "$out"
          host='https://desktop-6fn9b4m.tail1bf489.ts.net'
          paths=' /health /archie /archie/ /room /room/ /roast /roast/ /post /post/ /poke /poke/ /exec /exec/ /sidecar /sidecar/ /hotwire /hotwire/ /takeover /takeover/ /seat /seat/ /maker /maker/ /postchat /postchat/ /archie-phone /archie-phone/health'
          i=0
          for p in $paths; do i=$((i+1)); n=$(printf '%02d' "$i"); curl -k -L --connect-timeout 4 --max-time 10 -sS -D "$out/$n.headers" "$host$p" -o "$out/$n.body"; echo "$p $?" > "$out/$n.meta"; done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
