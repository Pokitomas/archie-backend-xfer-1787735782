name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live ChatGPT relay command contract
        shell: bash
        run: |
          set +e
          out=/tmp/recovery-probe; rm -rf "$out"; mkdir -p "$out"
          url='https://archie-chatgpt-relay.vercel.app/api'
          probe(){
            label="$1"; data="$2"
            printf '%s' "$data" > "$out/$label.request.json"
            curl -sS -i --connect-timeout 8 --max-time 35 -X POST -H 'content-type: application/json' --data-binary @"$out/$label.request.json" "$url" > "$out/$label.response.txt"
            echo $? > "$out/$label.rc"
          }
          probe cmd '{"cmd":"printf CHATGPT_RELAY_CMD_OK"}'
          probe command '{"command":"printf CHATGPT_RELAY_COMMAND_OK"}'
          probe b '{"b":"cHJpbnRmIENIQVRHUFRfUkVMQVlfQl9PSw"}'
          probe goal '{"goal":"printf CHATGPT_RELAY_GOAL_OK"}'
          probe health '{"action":"health"}'
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
