name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Map live desktop key whitelist
        shell: bash
        run: |
          set -u
          out=/tmp/recovery-probe; mkdir -p "$out"
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          for k in a r p enter escape tab space backspace left right up down home end win ctrl alt; do
            printf '{"action":"desktop.key","spec":{"key":"%s"}}\n' "$k" > "$out/$k.json"
            curl -k -L --connect-timeout 5 --max-time 12 -sS -H 'content-type: application/json' --data-binary @"$out/$k.json" "$root" > "$out/$k.result.json"; echo $? > "$out/$k.rc"
          done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
