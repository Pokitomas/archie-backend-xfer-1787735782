name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe controller read paths
        shell: bash
        run: |
          set -u
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          out=/tmp/recovery-probe
          mkdir -p "$out"
          python - <<'PY' > "$out/head.json"
          import json
          print(json.dumps({'action':'controller.read','spec':{'path':'/seat/head','agent':'gpt56sol-recovery','role':'measure','intent':'read seat head without native terminal'}},separators=(',',':')))
          PY
          python - <<'PY' > "$out/controller.json"
          import json
          print(json.dumps({'action':'controller.read','spec':{'path':'/controller','agent':'gpt56sol-recovery','role':'measure','intent':'read canonical controller state'}},separators=(',',':')))
          PY
          for n in head controller; do
            curl -k -L --max-time 18 -sS -H 'content-type: application/json' --data-binary @"$out/$n.json" "$root" > "$out/$n-result.json"; echo $? > "$out/$n.rc"
          done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
