name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Map surviving file-stage ingress
        shell: bash
        run: |
          set -u
          out=/tmp/recovery-probe; mkdir -p "$out"
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          printf '{"action":"file.stage"}' > "$out/missing.json"
          printf '{"action":"file.stage.ayya"}' > "$out/ayya-missing.json"
          printf '{"action":"file.stage.ayya.raw"}' > "$out/raw-missing.json"
          for ext in json jsonl md png wav zip ps1 sh txt; do
            python - "$ext" <<'PY' > "$out/stage-$ext.json"
          import base64,json,sys
          ext=sys.argv[1]; data=b'RECOVERY_STAGE_PROBE\n'
          print(json.dumps({'action':'file.stage','name':'gpt56-recovery-probe.'+ext,'base64':base64.b64encode(data).decode()},separators=(',',':')))
          PY
          done
          for f in "$out"/*.json; do n=$(basename "$f" .json); curl -k -L --connect-timeout 5 --max-time 12 -sS -H 'content-type: application/json' --data-binary @"$f" "$root" > "$out/$n.result.json"; echo $? > "$out/$n.rc"; done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
