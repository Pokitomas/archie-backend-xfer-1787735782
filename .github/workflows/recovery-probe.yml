name: recovery-probe
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe new host rescue and ring
        shell: bash
        run: |
          set +e
          out=/tmp/recovery-probe; rm -rf "$out"; mkdir -p "$out"
          host='desktop-6fn9b4m-1.tail1bf489.ts.net'
          curl -k -sS --connect-timeout 4 --max-time 12 -D "$out/rescue.headers" -o "$out/rescue.body" -w '%{http_code}\n' "https://$host:8443/health" > "$out/rescue.http"; echo $? > "$out/rescue.rc"
          root="https://$host/archie-phone/v1/action"
          for action in status.read phone.capabilities driver.read signal.read; do
            n=${action//./-}; printf '{"action":"%s"}' "$action" > "$out/$n.request.json"
            curl -k -L -sS --connect-timeout 4 --max-time 12 -D "$out/$n.headers" -o "$out/$n.body" -w '%{http_code}\n' -H 'content-type: application/json' --data-binary @"$out/$n.request.json" "$root" > "$out/$n.http"; echo $? > "$out/$n.rc"
          done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-probe
          path: /tmp/recovery-probe
          retention-days: 1
