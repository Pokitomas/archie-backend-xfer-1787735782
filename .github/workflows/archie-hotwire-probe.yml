name: ARCHIE hotwire probe

on:
  push:
    paths:
      - '.github/workflows/archie-hotwire-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Open Resolve console semantically
        shell: bash
        run: |
          set -euo pipefail
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          mkdir -p /tmp/archie-hotwire
          call(){ n="$1"; b="$2"; curl -k -L --max-time 20 -sS -H 'content-type: application/json' --data "$b" "$root" > "/tmp/archie-hotwire/$n.json" || true; }
          call editclick '{"action":"controller.action","spec":{"action":"tap","x":909,"y":990,"agent":"gpt56sol-hotwire","role":"execute","intent":"switch Resolve to Edit page"}}'
          sleep 1
          call afteredit '{"action":"controller.action","spec":{"action":"inspect","limit":180,"agent":"gpt56sol-hotwire","role":"measure","intent":"verify Edit page"}}'
          call workspace '{"action":"controller.action","spec":{"action":"poke","hwnd":32442934,"said":"Workspace","kind":"MenuItem","how":"invoke","agent":"gpt56sol-hotwire","role":"execute","intent":"open Workspace menu"}}'
          sleep 1
          call menu '{"action":"controller.action","spec":{"action":"inspect","limit":240,"agent":"gpt56sol-hotwire","role":"measure","intent":"locate Console menu entry"}}'
      - name: Upload state
        uses: actions/upload-artifact@v4
        with:
          name: archie-resolve-console-menu
          path: /tmp/archie-hotwire
          retention-days: 1
