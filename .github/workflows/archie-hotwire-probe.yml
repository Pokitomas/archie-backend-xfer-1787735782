name: ARCHIE hotwire probe

on:
  push:
    paths:
      - '.github/workflows/archie-hotwire-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Introspect live phone bridge
        shell: bash
        run: |
          set -u
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/'
          curl -k -L --max-time 10 -sS "$root" -o /tmp/index.html
          echo '=== SCRIPT SOURCES ==='
          grep -oE '<script[^>]+src="[^"]+"' /tmp/index.html | sed -E 's/.*src="([^"]+)".*/\1/' | tee /tmp/scripts.txt || true
          echo '=== INLINE ROUTE HINTS ==='
          grep -nEi 'fetch\(|WebSocket|EventSource|/action|/health|/state|/window|/seat|/cmd|/shell|token|POST' /tmp/index.html | head -200 || true
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            url="$root${src#./}"
            echo "=== JS $url ==="
            curl -k -L --max-time 10 -sS "$url" -o /tmp/app.js || continue
            grep -nEi 'fetch\(|WebSocket|EventSource|/action|/health|/state|/window|/seat|/cmd|/shell|token|POST|clipboard|hotkey|key|click|type' /tmp/app.js | head -350 || true
          done < /tmp/scripts.txt
