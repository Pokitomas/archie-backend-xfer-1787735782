name: ARCHIE hotwire probe
on:
  push:
    paths: ['.github/workflows/archie-hotwire-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Poll model ring build
        shell: bash
        run: |
          set -euo pipefail
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          mkdir -p /tmp/archie-hotwire
          curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data '{"action":"controller.action","spec":{"action":"native_terminal","op":"poll","terminal_id":"c425248e44e95d27","agent":"gpt56sol-model-ring","role":"measure","intent":"read completed native model-ring compile and selftest"}}' "$root" > /tmp/archie-hotwire/poll.json || true
          curl -k -L --max-time 15 -sS -H 'content-type: application/json' --data '{"action":"controller.action","spec":{"action":"inspect","limit":160,"agent":"gpt56sol-model-ring","role":"measure","intent":"verify model-ring resident process"}}' "$root" > /tmp/archie-hotwire/inspect.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: model-ring-native-poll
          path: /tmp/archie-hotwire
          retention-days: 1
