name: ARCHIE hotwire probe
on:
  push:
    paths: ['.github/workflows/archie-hotwire-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read current state
        shell: bash
        run: |
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          mkdir -p /tmp/archie-hotwire
          curl -k -L --max-time 10 -sS -H 'content-type: application/json' --data '{"action":"controller.read"}' "$root" > /tmp/archie-hotwire/state.json || true
          curl -k -L --max-time 10 -sS -H 'content-type: application/json' --data '{"action":"controller.action","spec":{"action":"inspect","limit":160,"agent":"gpt56sol-hotwire","role":"measure","intent":"read current Resolve timeline"}}' "$root" > /tmp/archie-hotwire/inspect.json || true
          curl -k -L --max-time 10 -sS -H 'content-type: application/json' --data '{"action":"controller.action","spec":{"action":"sense","sense":"region","image":true,"agent":"gpt56sol-hotwire","role":"measure","intent":"see current Resolve timeline"}}' "$root" > /tmp/archie-hotwire/shot.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: archie-post-burst-state
          path: /tmp/archie-hotwire
          retention-days: 1
