name: ARCHIE hotwire probe

on:
  push:
    paths:
      - '.github/workflows/archie-hotwire-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Resume edit through live resident seat
        shell: bash
        run: |
          set -euo pipefail
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          mkdir -p /tmp/archie-hotwire
          printf '%s' '' | base64 -d > /tmp/archie-hotwire/input.json
          curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/input.json "$root" > /tmp/archie-hotwire/accepted.json
          sleep 8
          curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data '{"action":"controller.read"}' "$root" > /tmp/archie-hotwire/read-after.json
      - name: Upload private edit receipt
        uses: actions/upload-artifact@v4
        with:
          name: archie-edit-resume
          path: /tmp/archie-hotwire
          retention-days: 1
          if-no-files-found: error
