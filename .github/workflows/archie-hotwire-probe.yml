name: ARCHIE hotwire probe

on:
  push:
    paths:
      - '.github/workflows/archie-hotwire-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read live controller through surviving phone bridge
        shell: bash
        run: |
          set -u
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/'
          echo '=== WELL KNOWN ==='
          curl -k -L --max-time 10 -sS "$root.well-known/archie-phone.json" || true
          echo
          echo '=== CONTROLLER READ ==='
          curl -k -L --max-time 15 -sS \
            -H 'content-type: application/json' \
            --data '{"action":"controller.read"}' \
            "$root/v1/action" || true
          echo
