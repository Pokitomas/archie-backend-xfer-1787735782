name: ARCHIE hotwire probe
on:
  push:
    paths: ['.github/workflows/archie-hotwire-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Build model-native SPSC ring on PC
        shell: bash
        run: |
          set -euo pipefail
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          mkdir -p /tmp/archie-hotwire
          python - <<'PY' > /tmp/archie-hotwire/start.json
          import json
          code = "import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"
          body = {"action":"controller.action","spec":{"action":"native_terminal","op":"start","argv":[r"C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\python.exe","-c",code],"agent":"gpt56sol-model-ring","role":"execute","intent":"build a fresh model-native Win32 SPSC shared-memory ring before inspecting or replacing legacy controller code"}}
          print(json.dumps(body,separators=(',',':')))
          PY
          curl -k -L --max-time 30 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/start.json "$root" > /tmp/archie-hotwire/start-result.json
          sleep 4
          python - <<'PY' /tmp/archie-hotwire/start-result.json > /tmp/archie-hotwire/poll.json
          import json,sys
          v=json.load(open(sys.argv[1]))
          r=v.get("result") or {}
          tid=((r.get("result") or r).get("terminal_id") if isinstance(r,dict) else None)
          print(json.dumps({"action":"controller.action","spec":{"action":"native_terminal","op":"poll","terminal_id":tid,"agent":"gpt56sol-model-ring","role":"measure","intent":"read fresh model-ring build and selftest result"}},separators=(',',':')))
          PY
          curl -k -L --max-time 30 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/poll.json "$root" > /tmp/archie-hotwire/poll-result.json || true
          sleep 15
          curl -k -L --max-time 30 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/poll.json "$root" > /tmp/archie-hotwire/poll-result-2.json || true
          curl -k -L --max-time 15 -sS -H 'content-type: application/json' --data '{"action":"controller.action","spec":{"action":"inspect","limit":180,"agent":"gpt56sol-model-ring","role":"measure","intent":"verify local model-ring process and build surface"}}' "$root" > /tmp/archie-hotwire/inspect.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: model-ring-native-build
          path: /tmp/archie-hotwire
          retention-days: 1
