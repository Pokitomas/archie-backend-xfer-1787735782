name: ARCHIE hotwire probe
on:
  push:
    paths: ['.github/workflows/archie-hotwire-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify native PC-first takeover
        shell: bash
        run: |
          set -euo pipefail
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          mkdir -p /tmp/archie-hotwire
          curl -k -L --max-time 20 -sS -H 'content-type: application/json' --data '{"action":"controller.action","spec":{"action":"native_terminal","op":"poll","terminal_id":"0aa836615c1d86c1","agent":"gpt56sol-native-takeover","role":"measure","intent":"verify adopted native resident coding ring bootstrap completion"}}' "$root" > /tmp/archie-hotwire/bootstrap-poll.json || true
          curl -k -L --max-time 15 -sS -H 'content-type: application/json' --data '{"action":"controller.read"}' "$root" > /tmp/archie-hotwire/state.json || true
          curl -k -L --max-time 15 -sS -H 'content-type: application/json' --data '{"action":"controller.action","spec":{"action":"inspect","limit":220,"agent":"gpt56sol-native-takeover","role":"measure","intent":"verify native coding surface after takeover"}}' "$root" > /tmp/archie-hotwire/inspect.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: gpt56-native-takeover-verify
          path: /tmp/archie-hotwire
          retention-days: 1
