name: ARCHIE hotwire probe

on:
  push:
    paths:
      - '.github/workflows/archie-hotwire-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read edit progress
        shell: bash
        run: |
          set -euo pipefail
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          mkdir -p /tmp/archie-hotwire
          post(){ name="$1"; body="$2"; curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data "$body" "$root" > "/tmp/archie-hotwire/${name}.json" || true; }
          post state '{"action":"controller.read"}'
          post inspect '{"action":"controller.action","spec":{"action":"inspect","limit":240,"agent":"operator-phone","role":"measure","intent":"verify Resolve edit progress"}}'
          post windows '{"action":"controller.action","spec":{"action":"windows","limit":80,"agent":"operator-phone","role":"measure","intent":"verify Resolve surfaces"}}'
      - name: Upload private progress state
        uses: actions/upload-artifact@v4
        with:
          name: archie-edit-progress
          path: /tmp/archie-hotwire
          retention-days: 1
          if-no-files-found: error
