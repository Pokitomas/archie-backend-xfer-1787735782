name: ARCHIE hotwire probe

on:
  push:
    paths:
      - '.github/workflows/archie-hotwire-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enter Edit and capture Workspace menu
        shell: bash
        run: |
          set -euo pipefail
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          mkdir -p /tmp/archie-hotwire
          call(){ n="$1"; b="$2"; curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data "$b" "$root" > "/tmp/archie-hotwire/$n.json" || true; }
          call edit '{"action":"controller.action","spec":{"action":"poke","hwnd":32442934,"said":"Edit","kind":"CheckBox","how":"invoke","agent":"gpt56sol-hotwire","role":"execute","intent":"switch Resolve to Edit page"}}'
          sleep 1
          call editshot '{"action":"controller.action","spec":{"action":"sense","sense":"region","image":true,"agent":"gpt56sol-hotwire","role":"measure","intent":"see current Resolve Edit page"}}'
          call workspace '{"action":"controller.action","spec":{"action":"poke","hwnd":32442934,"said":"Workspace","kind":"MenuItem","how":"invoke","agent":"gpt56sol-hotwire","role":"execute","intent":"open Workspace menu"}}'
          sleep 1
          call menushot '{"action":"controller.action","spec":{"action":"sense","sense":"region","image":true,"agent":"gpt56sol-hotwire","role":"measure","intent":"see Workspace menu and Console position"}}'
      - name: Upload visual state
        uses: actions/upload-artifact@v4
        with:
          name: archie-resolve-visual-menu
          path: /tmp/archie-hotwire
          retention-days: 1
