name: ARCHIE hotwire probe
on:
  push:
    paths: ['.github/workflows/archie-hotwire-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compile model ring with portable compiler
        shell: bash
        run: |
          set -euo pipefail
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          mkdir -p /tmp/archie-hotwire
          python - <<'PY' > /tmp/archie-hotwire/start.json
          import json
          code = "import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"
          body = {"action":"controller.action","spec":{"action":"native_terminal","op":"start","argv":[r"C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\python.exe","-c",code],"agent":"gpt56sol-model-ring","role":"execute","intent":"compile and start the fresh model-native SPSC ring using a portable local compiler"}}
          print(json.dumps(body,separators=(',',':')))
          PY
          curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/start.json "$root" > /tmp/archie-hotwire/start-result.json
          sleep 6
          python - <<'PY' /tmp/archie-hotwire/start-result.json > /tmp/archie-hotwire/poll-request.json
          import json,sys
          v=json.load(open(sys.argv[1]))
          r=v.get('result') or {}
          inner=(r.get('result') or r) if isinstance(r,dict) else {}
          tid=inner.get('terminal_id')
          print(json.dumps({"action":"controller.action","spec":{"action":"native_terminal","op":"poll","terminal_id":tid,"agent":"gpt56sol-model-ring","role":"measure","intent":"read model-ring compile and selftest result"}},separators=(',',':')))
          PY
          curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/poll-request.json "$root" > /tmp/archie-hotwire/poll.json || true
          sleep 5
          curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/poll-request.json "$root" > /tmp/archie-hotwire/poll2.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: model-ring-tcc-build
          path: /tmp/archie-hotwire
          retention-days: 1
