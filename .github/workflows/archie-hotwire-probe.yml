name: ARCHIE hotwire probe

on:
  push:
    paths:
      - '.github/workflows/archie-hotwire-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Local Resolve navigation hand
        shell: bash
        run: |
          set -euo pipefail
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          mkdir -p /tmp/archie-hotwire
          python - <<'PY' > /tmp/archie-hotwire/start.json
          import json
          code="""import pyautogui,time
pyautogui.click(970,78)
time.sleep(.5)
pyautogui.click(1000,323)
time.sleep(1)
pyautogui.press('home')
time.sleep(.4)
for _ in range(6):
    pyautogui.hotkey('shift','down'); time.sleep(.18)
"""
          print(json.dumps({'action':'controller.action','spec':{'action':'native_terminal','op':'start','argv':[r'C:\\Python314\\python.exe','-c',code],'agent':'gpt56sol-hotwire','role':'execute','intent':'select GPT PASS 01 and navigate to sixth marker locally'}}))
          PY
          curl -k -L --max-time 20 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/start.json "$root" > /tmp/archie-hotwire/start-result.json
          sleep 4
          curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data '{"action":"controller.action","spec":{"action":"sense","sense":"region","image":true,"agent":"gpt56sol-hotwire","role":"measure","intent":"see safe timeline at sixth marker"}}' "$root" > /tmp/archie-hotwire/shot.json
          curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data '{"action":"controller.action","spec":{"action":"inspect","limit":200,"agent":"gpt56sol-hotwire","role":"measure","intent":"verify safe timeline and playhead"}}' "$root" > /tmp/archie-hotwire/inspect.json
      - name: Upload state
        uses: actions/upload-artifact@v4
        with:
          name: archie-local-marker-hand
          path: /tmp/archie-hotwire
          retention-days: 1
