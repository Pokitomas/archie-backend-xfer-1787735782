name: ARCHIE hotwire probe
on:
  push:
    paths: ['.github/workflows/archie-hotwire-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Build fresh model ring and retire superseded scratch
        shell: bash
        run: |
          set -euo pipefail
          root='https://desktop-6fn9b4m.tail1bf489.ts.net/archie-phone/v1/action'
          mkdir -p /tmp/archie-hotwire
          cat > /tmp/archie-hotwire/start.json <<'EOF'
          {"action":"controller.action","spec":{"action":"native_terminal","op":"start","argv":["C:\\Users\\AwesomeKai\\AppData\\Local\\Programs\\Python\\Python312\\python.exe","-c","import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"],"agent":"gpt56sol-model-ring","role":"execute","intent":"build fresh model-native shared-memory SPSC resident, self-test it, persist it, then delete only superseded controller scratch after PASS"}}
          EOF
          curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/start.json "$root" > /tmp/archie-hotwire/start-result.json
          sleep 7
          python - <<'PY' /tmp/archie-hotwire/start-result.json > /tmp/archie-hotwire/poll-request.json
          import json,sys
          v=json.load(open(sys.argv[1])); r=v.get('result') or {}; inner=(r.get('result') or r) if isinstance(r,dict) else {}; tid=inner.get('terminal_id')
          print(json.dumps({"action":"controller.action","spec":{"action":"native_terminal","op":"poll","terminal_id":tid,"agent":"gpt56sol-model-ring","role":"measure","intent":"read final model-ring build and deletion receipt"}},separators=(',',':')))
          PY
          curl -k -L --max-time 25 -sS -H 'content-type: application/json' --data-binary @/tmp/archie-hotwire/poll-request.json "$root" > /tmp/archie-hotwire/poll.json || true
          curl -k -L --max-time 20 -sS -H 'content-type: application/json' --data '{"action":"controller.action","spec":{"action":"native_terminal","op":"start","argv":["C:\\Users\\AwesomeKai\\AppData\\Local\\Programs\\Python\\Python312\\python.exe","C:\\Users\\AwesomeKai\\AppData\\Local\\ModelRing\\model_ring.py","call","{\\"op\\":\\"ping\\"}"],"agent":"gpt56sol-model-ring","role":"measure","intent":"independent post-build ring ping"}}' "$root" > /tmp/archie-hotwire/post-ping-start.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: model-ring-final
          path: /tmp/archie-hotwire
          retention-days: 1
