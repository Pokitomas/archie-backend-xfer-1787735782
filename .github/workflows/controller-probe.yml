name: controller-probe
on:
  push:
    paths:
      - '.github/workflows/controller-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe controller contract
        shell: bash
        run: |
          set -x
          for u in \
            'https://archie-gpt56-live-controller.vercel.app/api/index' \
            'https://archie-gpt56-live-controller.vercel.app/api' \
            'https://archie-gpt56-live-controller.vercel.app/'; do
            echo "=== $u ==="
            curl -sS -i --max-time 25 \
              -X POST \
              -H 'content-type: application/json' \
              --data '{}' \
              "$u" || true
            echo
          done
