name: archie-nanny-entry
on:
  push:
    paths: ['.github/workflows/archie-nanny-entry.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live controller before entry
        shell: bash
        run: |
          set -euo pipefail
          B=''
          BASE="$(grep -oE 'https://desktop-6fn9b4m-1\.tail1bf489\.ts\.net/[A-Za-z0-9_-]+/cmd' .github/workflows/kernel-maker-handoff-v2.yml | head -1)"
          test -n "$BASE"
          curl -fsS --max-time 25 "$BASE?b=$B"
