name: clone-live-seat-probe
on:
  push:
    paths:
      - '.github/workflows/clone-live-seat-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: read-only live PC probe through existing relay
        shell: bash
        run: |
          set -Eeuo pipefail
          out=/tmp/clone-live-seat-probe
          rm -rf "$out"; mkdir -p "$out"
          cat > "$out/pc.sh" <<'PC'
          #!/usr/bin/env bash
          set +e
          echo "CLONE_PROBE_V1"
          echo "time=$(date -Is)"
          echo "host=$(hostname)"
          echo "user=$(id -un)"
          echo "pwd=$(pwd)"
          echo "--- seat-head ---"
          curl -sS --max-time 2 http://127.0.0.1:8798/seat/head 2>&1 || true
          echo
          echo "--- canonical-ring ---"
          for u in archie-ring.target archie-ingress.service archie-runtime-truth.service archie-live-exec.service archie-toolbus.service; do
            printf '%-34s %s\n' "$u" "$(systemctl --user is-active "$u" 2>/dev/null || echo missing)"
          done
          echo "--- listening ---"
          ss -ltnp 2>/dev/null | grep -E ':(8787|8789|8791|8798|8799|8443)\b' || true
          echo "--- archie-processes ---"
          ps -eo pid,ppid,etimes,cmd | grep -Ei '[a]rchie|[r]esident|[o]rganism' | head -120
          echo "--- windows-processes ---"
          powershell.exe -NoLogo -NoProfile -Command "Get-Process | Where-Object { \$_.ProcessName -match 'ChatGPT|msedge|WindowsTerminal|python|wsl|davinci' } | Select-Object ProcessName,Id,CPU,WorkingSet64 | Sort-Object ProcessName | Format-Table -AutoSize" 2>&1 | tr -d '\r' || true
          PC
          chmod +x "$out/pc.sh"
          b64=$(base64 -w0 "$out/pc.sh")
          export PC_CMD="printf '%s' '$b64' | base64 -d | bash"
          python3 - <<'PY' > "$out/request.json"
          import base64,json,os
          cmd=os.environ['PC_CMD']
          print(json.dumps({
            'cmd':cmd,
            'command':cmd,
            'goal':cmd,
            'b':base64.urlsafe_b64encode(cmd.encode()).decode().rstrip('='),
            'intent':'read-only clone probe; preserve every existing process and session'
          },separators=(',',':')))
          PY
          curl --fail-with-body -sS -i --connect-timeout 8 --max-time 55 \
            -X POST -H 'content-type: application/json' \
            --data-binary @"$out/request.json" \
            'https://archie-chatgpt-relay.vercel.app/api' | tee "$out/response.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clone-live-seat-probe
          path: /tmp/clone-live-seat-probe
          retention-days: 1
